name: Build Zoreno Native AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o zorenoapp.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android Bundle (Release)
        run: ./gradlew bundleRelease

      - name: Sign Android App Bundle
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore zoreno-release-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" app/build/outputs/bundle/release/app-release.aab zoreno

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: zoreno-v10-release
          path: app/build/outputs/bundle/release/app-release.aab
          
