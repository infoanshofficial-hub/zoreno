                                      java.io.File mp3File = new java.io.File(getCacheDir(), "zoreno_nvidia_tts.mp3");
                                      try (java.io.InputStream is = conn.getInputStream(); java.io.FileOutputStream fos = new java.io.FileOutputStream(mp3File)) {
                                          byte[] buf = new byte[4096]; int n; while ((n = is.read(buf)) != -1) fos.write(buf, 0, n);
                                      }
                                      if (mp3File.length() > 200) {
                                          playedCloud = true;
                                          runOnUiThread(() -> {
                                              try {
                                                  if (zorenoMediaPlayer != null) zorenoMediaPlayer.release();
                                                  zorenoMediaPlayer = new android.media.MediaPlayer();
                                                  zorenoMediaPlayer.setDataSource(mp3File.getAbsolutePath());
                                                  zorenoMediaPlayer.prepare(); zorenoMediaPlayer.start();
                                              } catch (Exception ex) {}
                                          });
                                      }
                                  }
                              } catch (Exception ignored) {}
                              if (!playedCloud && zorenoTts != null && zorenoTtsReady) {
                                  runOnUiThread(() -> {
                                      java.util.Locale loc = java.util.Locale.forLanguageTag(lang != null ? lang : "en-IN");
                                      selectBestNaturalVoice(loc);
                                      zorenoTts.speak(text, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "zoreno_utt");
                                  });
                              }
                          }).start();
                      }
