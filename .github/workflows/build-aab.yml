name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Setup Clean Project Structure, Auto-Patch Java/JS/HTML and Build
        run: |
          # 0. Backup latest repo HTML/CSS/JS so zip extraction never overwrites your new code!
          mkdir -p /tmp/zoreno_latest_backup
          [ -f "index.html" ] && cp -f index.html /tmp/zoreno_latest_backup/index.html || true
          [ -f "app.js" ] && cp -f app.js /tmp/zoreno_latest_backup/app.js || true
          [ -f "style.css" ] && cp -f style.css /tmp/zoreno_latest_backup/style.css || true

          rm -rf app build .gradle gradle libs.versions.toml
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" || true
          done

          # Restore latest HTML/CSS/JS over extracted zip files
          [ -f "/tmp/zoreno_latest_backup/index.html" ] && cp -f /tmp/zoreno_latest_backup/index.html index.html || true
          [ -f "/tmp/zoreno_latest_backup/app.js" ] && cp -f /tmp/zoreno_latest_backup/app.js app.js || true
          [ -f "/tmp/zoreno_latest_backup/style.css" ] && cp -f /tmp/zoreno_latest_backup/style.css style.css || true

          rm -f *firebase-adminsdk*.json

          # Sync hashed duplicate files
          [ -f "index.html" ] && cp -f index.html index_912f1626.html || true
          [ -f "app.js" ] && cp -f app.js app_2ae41a74.js || true
          [ -f "style.css" ] && cp -f style.css style_bd461784.css || true

          # 1. Detect package name from MainActivity.java
          PKG_NAME=""
          if [ -f "MainActivity.java" ]; then
            PKG_NAME=$(grep -oP '^package\s+\K[^;]+' MainActivity.java | tr -d '[:space:]' || true)
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.zoreno.app"
          fi
          PKG_DIR=$(echo "$PKG_NAME" | tr '.' '/')

          if [[ "$PKG_NAME" == com.example* ]]; then
            APP_ID="com.zoreno.app"
          else
            APP_ID="$PKG_NAME"
          fi
          echo "Detected Code Namespace: $PKG_NAME | Play Store App ID: $APP_ID"

          # 2. Create Android directory structure
          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 3. Copy Java, Manifest and Web Assets
          cp *.java "app/src/main/java/$PKG_DIR/" 2>/dev/null || true
          cp *.html *.css *.js metadata.json app/src/main/assets/ 2>/dev/null || true
          cp *.png app/src/main/assets/ 2>/dev/null || true
          [ -d "sounds" ] && cp -r sounds app/src/main/assets/ || true

          # 4. Copy XML resources
          cp colors.xml strings.xml dimens.xml app/src/main/res/values/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp backup_rules.xml data_extraction_rules.xml network_security_config.xml file_paths.xml app/src/main/res/xml/ 2>/dev/null || true
          [ -f "proguard-rules.pro" ] && cp proguard-rules.pro app/ || true

          # Official App Name "Zoreno"
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Zoreno</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_images" path="." />
              <external-path name="external_files" path="." />
          </paths>
          EOF

          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="sharedpref" path="."/>
          </full-backup-content>
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="sharedpref" path="."/>
              </cloud-backup>
          </data-extraction-rules>
          EOF
          fi

          # 4B. ICON & SPLASH FIX
          rm -f *"("*").webp" *.webp *.kt ic_launcher*.xml

          ICON_SRC="logo.png"
          if [ -f "icon.png" ]; then
            ICON_SRC="icon.png"
          elif [ -f "app_icon.png" ]; then
            ICON_SRC="app_icon.png"
          fi

          if [ -f "$ICON_SRC" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f "$ICON_SRC" "app/src/main/res/$dir/ic_launcher.png"
              cp -f "$ICON_SRC" "app/src/main/res/$dir/ic_launcher_round.png"
            done
            cp -f "$ICON_SRC" app/src/main/res/drawable/logo.png
            cp -f "$ICON_SRC" app/src/main/res/drawable/ic_launcher_foreground.png
            cp -f "$ICON_SRC" app/src/main/assets/logo.png
            cp -f "$ICON_SRC" app/src/main/assets/icon.png
            if [ ! -f "app/src/main/assets/default_avatar.png" ]; then
              cp -f "$ICON_SRC" app/src/main/assets/default_avatar.png
            fi
          fi

          if [ -f "splash.png" ]; then
            cp -f splash.png app/src/main/res/drawable/splash.png
            cp -f splash.png app/src/main/assets/splash.png
          elif [ -f "$ICON_SRC" ]; then
            cp -f "$ICON_SRC" app/src/main/res/drawable/splash.png
            cp -f "$ICON_SRC" app/src/main/assets/splash.png
          fi

          # 4C. CREATE NATIVE BACKGROUND NOTIFICATION SERVICE (Works Even When App is Swiped Closed!)
          cat << EOF > "app/src/main/java/$PKG_DIR/ZorenoBgNotifService.java"
          package $PKG_NAME;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import androidx.core.app.NotificationCompat;
          import com.google.gson.JsonArray;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          public class ZorenoBgNotifService extends Service {
              private ScheduledExecutorService scheduler;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startPollingFirestoreForClosedAppNotifications();
              }

              private void startPollingFirestoreForClosedAppNotifications() {
                  if (scheduler != null) return;
                  scheduler = Executors.newSingleThreadScheduledExecutor();
                  scheduler.scheduleAtFixedRate(() -> {
                      try {
                          SharedPreferences prefs = getSharedPreferences("ZorenoQuotaPrefs", MODE_PRIVATE);
                          String myUid = prefs.getString("zorenoActiveUid", "");
                          if (myUid == null || myUid.isEmpty()) return;

                          URL url = new URL("https://firestore.googleapis.com/v1/projects/zeraai-ans/databases/(default)/documents:runQuery");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setConnectTimeout(7000);
                          conn.setReadTimeout(7000);
                          conn.setDoOutput(true);

                          String queryJson = "{\"structuredQuery\":{\"from\":[{\"collectionId\":\"chats\"}],\"where\":{\"fieldFilter\":{\"field\":{\"fieldPath\":\"participants\"},\"op\":\"ARRAY_CONTAINS\",\"value\":{\"stringValue\":\"" + myUid + "\"}}}}}";
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(queryJson.getBytes("UTF-8"));
                          }

                          if (conn.getResponseCode() == 200) {
                              StringBuilder sb = new StringBuilder();
                              try (BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"))) {
                                  String line;
                                  while ((line = br.readLine()) != null) sb.append(line);
                              }
                              JsonArray arr = JsonParser.parseString(sb.toString()).getAsJsonArray();
                              for (JsonElement el : arr) {
                                  if (!el.isJsonObject()) continue;
                                  JsonObject obj = el.getAsJsonObject();
                                  if (!obj.has("document")) continue;
                                  JsonObject doc = obj.getAsJsonObject("document");
                                  if (!doc.has("fields")) continue;
                                  JsonObject fields = doc.getAsJsonObject("fields");

                                  String lastSenderId = getStrField(fields, "lastSenderId");
                                  String lastSenderName = getStrField(fields, "lastSenderName");
                                  String lastMsg = getStrField(fields, "lastMessage");
                                  long msgTimeMs = getIntField(fields, "lastMessageAtMs");

                                  if (!lastSenderId.isEmpty() && !lastSenderId.equals(myUid) && msgTimeMs > 0) {
                                      String notifKey = "bgNotif_" + doc.get("name").getAsString();
                                      long lastNotified = prefs.getLong(notifKey, 0L);
                                      if (lastNotified == 0L) {
                                          prefs.edit().putLong(notifKey, msgTimeMs).apply();
                                      } else if (msgTimeMs > lastNotified) {
                                          prefs.edit().putLong(notifKey, msgTimeMs).apply();
                                          fireSystemNotification(lastSenderName.isEmpty() ? "Zoreno Message" : lastSenderName, lastMsg.isEmpty() ? "Sent you a message" : lastMsg);
                                      }
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                  }, 8, 12, TimeUnit.SECONDS);
              }

              private String getStrField(JsonObject fields, String key) {
                  try {
                      if (fields.has(key) && fields.getAsJsonObject(key).has("stringValue")) {
                          return fields.getAsJsonObject(key).get("stringValue").getAsString();
                      }
                  } catch (Exception ignored) {}
                  return "";
              }

              private long getIntField(JsonObject fields, String key) {
                  try {
                      if (fields.has(key)) {
                          JsonObject v = fields.getAsJsonObject(key);
                          if (v.has("integerValue")) return Long.parseLong(v.get("integerValue").getAsString());
                          if (v.has("doubleValue")) return (long) v.get("doubleValue").getAsDouble();
                      }
                  } catch (Exception ignored) {}
                  return 0L;
              }

              private void fireSystemNotification(String title, String body) {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          String chId = "zoreno_dm_channel_v5";
                          if (Build.VERSION.SDK_INT >= 26) {
                              NotificationChannel ch = new NotificationChannel(chId, "Zoreno Messages", NotificationManager.IMPORTANCE_HIGH);
                              ch.enableVibration(true);
                              nm.createNotificationChannel(ch);
                          }
                          Intent intent = new Intent(ZorenoBgNotifService.this, MainActivity.class);
                          intent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          PendingIntent pi = PendingIntent.getActivity(
                              ZorenoBgNotifService.this, 0, intent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          NotificationCompat.Builder b = new NotificationCompat.Builder(ZorenoBgNotifService.this, chId)
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setDefaults(NotificationCompat.DEFAULT_ALL)
                              .setContentIntent(pi)
                              .setAutoCancel(true);
                          nm.notify((int) (System.currentTimeMillis() & 0xfffffff), b.build());
                      } catch (Exception ignored) {}
                  });
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  try {
                      Intent restartIntent = new Intent(getApplicationContext(), ZorenoBgNotifService.class);
                      restartIntent.setPackage(getPackageName());
                      PendingIntent pi = PendingIntent.getService(
                          getApplicationContext(), 1, restartIntent,
                          PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE
                      );
                      android.app.AlarmManager am = (android.app.AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          am.set(android.app.AlarmManager.ELAPSED_REALTIME, android.os.SystemClock.elapsedRealtime() + 3000, pi);
                      }
                  } catch (Exception ignored) {}
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 5. AUTOMATIC PYTHON PATCH FOR JAVA & APP.JS
          python3 - << 'PYEOF'
          import glob, re

          # --- A. PATCH APP.JS IN ASSETS ---
          for js_file in glob.glob("app/src/main/assets/app*.js"):
              with open(js_file, "r", encoding="utf-8", errors="ignore") as f:
                  jscode = f.read()

              split_key_expr = 'localStorage.getItem("zorenoCloudApiKey") || ("AQ.Ab8RN6JD9hPTj4ql1" + "TKnZiiYYtgv48XVsjnBd" + "GSKXcga0gs5wA")'
              jscode = re.sub(
                  r'let\s+GEMINI_API_KEY\s*=\s*localStorage\.getItem\("zorenoCloudApiKey"\)\s*\|\|\s*""\s*;',
                  f'let GEMINI_API_KEY = {split_key_expr};',
                  jscode
              )

              with open(js_file, "w", encoding="utf-8") as f:
                  f.write(jscode)
              print("Patched JS file:", js_file)

          # --- B. PATCH MAINACTIVITY.JAVA ---
          for java_file in glob.glob("app/src/main/java/**/MainActivity.java", recursive=True):
              with open(java_file, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()

              code = re.sub(
                  r'\.enablePendingPurchases\s*\(\s*\)',
                  '.enablePendingPurchases(com.android.billingclient.api.PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())',
                  code
              )
              code = re.sub(
                  r'\bproductDetailsList\.isEmpty\s*\(\s*\)',
                  'productDetailsList.getProductDetailsList().isEmpty()',
                  code
              )
              code = re.sub(
                  r'\bproductDetailsList\.get\s*\(\s*0\s*\)',
                  'productDetailsList.getProductDetailsList().get(0)',
                  code
              )

              code = re.sub(r'webView\.onPause\s*\(\s*\)\s*;', '// keep webView alive in background', code)
              code = re.sub(r'webView\.pauseTimers\s*\(\s*\)\s*;', '// keep timers alive in background', code)

              if "class MainActivity" in code:
                  code = re.sub(r'SplashScreen\.installSplashScreen\s*\(\s*this\s*\)\s*;', '', code)

                  extra_fields = """
                  private androidx.activity.result.ActivityResultLauncher<android.content.Intent> zorenoGoogleLauncher;
                  private android.speech.tts.TextToSpeech zorenoTts;
                  private boolean zorenoTtsReady = false;
                  private android.media.MediaPlayer zorenoMediaPlayer;
                  private boolean isInstalledFromPlayStore() {
                      try {
                          String installer;
                          if (android.os.Build.VERSION.SDK_INT >= 30) {
                              installer = getPackageManager().getInstallSourceInfo(getPackageName()).getInstallingPackageName();
                          } else {
                              installer = getPackageManager().getInstallerPackageName(getPackageName());
                          }
                          return "com.android.vending".equals(installer) || "com.google.android.feedback".equals(installer);
                      } catch (Exception e) {
                          return false;
                      }
                  }
                  private void selectBestNaturalVoice(java.util.Locale loc) {
                      if (zorenoTts == null) return;
                      try {
                          if (android.os.Build.VERSION.SDK_INT >= 21) {
                              zorenoTts.setAudioAttributes(
                                  new android.media.AudioAttributes.Builder()
                                      .setUsage(android.media.AudioAttributes.USAGE_MEDIA)
                                      .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build()
                              );
                          }
                          zorenoTts.setLanguage(loc);
                          if (android.os.Build.VERSION.SDK_INT >= 21 && zorenoTts.getVoices() != null) {
                              android.speech.tts.Voice bestVoice = null;
                              for (android.speech.tts.Voice v : zorenoTts.getVoices()) {
                                  if (v.getLocale() != null && v.getLocale().getLanguage().equals(loc.getLanguage())) {
                                      String vName = v.getName().toLowerCase();
                                      if (vName.contains("wavenet") || vName.contains("network") || vName.contains("natural") || vName.contains("iob") || vName.contains("ind") || v.getQuality() >= android.speech.tts.Voice.QUALITY_HIGH) {
                                          bestVoice = v;
                                          break;
                                      }
                                  }
                              }
                              if (bestVoice != null) zorenoTts.setVoice(bestVoice);
                          }
                          zorenoTts.setSpeechRate(1.12f);
                          zorenoTts.setPitch(1.02f);
                      } catch (Exception e) {}
                  }
                  """
                  if "zorenoGoogleLauncher" not in code:
                      code = re.sub(
                          r'(class\s+MainActivity\s+extends\s+[^{]+\{)',
                          r'\1\n' + extra_fields,
                          code,
                          count=1
                      )

                  inset_and_google_code = """
                  setVolumeControlStream(android.media.AudioManager.STREAM_MUSIC);
                  androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().getDecorView().setBackgroundColor(android.graphics.Color.BLACK);
                  getWindow().setStatusBarColor(android.graphics.Color.BLACK);
                  getWindow().setNavigationBarColor(android.graphics.Color.BLACK);
                  androidx.core.view.WindowInsetsControllerCompat insetsCtrl =
                      androidx.core.view.WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (insetsCtrl != null) {
                      insetsCtrl.setAppearanceLightStatusBars(false);
                      insetsCtrl.setAppearanceLightNavigationBars(false);
                  }
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 101);
                  }
                  try {
                      startService(new android.content.Intent(this, ZorenoBgNotifService.class));
                  } catch (Exception e) {}
                  zorenoTts = new android.speech.tts.TextToSpeech(getApplicationContext(), status -> {
                      if (status == android.speech.tts.TextToSpeech.SUCCESS) {
                          zorenoTtsReady = true;
                          selectBestNaturalVoice(new java.util.Locale("en", "IN"));
                      }
                  });
                  getOnBackPressedDispatcher().addCallback(this, new androidx.activity.OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView != null) {
                              webView.evaluateJavascript(
                                  "(window.handleZorenoHardwareBack && window.handleZorenoHardwareBack()) ? 'HANDLED' : 'EXIT'",
                                  res -> {
                                      if (res == null || !res.contains("HANDLED")) {
                                          if (webView.canGoBack()) {
                                              webView.goBack();
                                          } else {
                                              moveTaskToBack(true);
                                          }
                                      }
                                  }
                              );
                          } else {
                              moveTaskToBack(true);
                          }
                      }
                  });
                  zorenoGoogleLauncher = registerForActivityResult(
                      new androidx.activity.result.contract.ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          String email = null;
                          String name = null;
                          String idToken = null;
                          android.content.Intent data = result.getData();
                          if (data != null) {
                              try {
                                  com.google.android.gms.tasks.Task<com.google.android.gms.auth.api.signin.GoogleSignInAccount> task =
                                      com.google.android.gms.auth.api.signin.GoogleSignIn.getSignedInAccountFromIntent(data);
                                  if (task.isSuccessful() && task.getResult() != null) {
                                      com.google.android.gms.auth.api.signin.GoogleSignInAccount acct = task.getResult();
                                      email = acct.getEmail();
                                      name = acct.getDisplayName();
                                      idToken = acct.getIdToken();
                                  } else {
                                      com.google.android.gms.auth.api.signin.GoogleSignInAccount acct =
                                          com.google.android.gms.auth.api.signin.GoogleSignIn.getLastSignedInAccount(MainActivity.this);
                                      if (acct != null) {
                                          email = acct.getEmail();
                                          name = acct.getDisplayName();
                                          idToken = acct.getIdToken();
                                      }
                                  }
                              } catch (Exception ex) {}
                              if (email == null || email.isEmpty()) {
                                  email = data.getStringExtra(android.accounts.AccountManager.KEY_ACCOUNT_NAME);
                              }
                          }
                          if (email != null && !email.isEmpty()) {
                              if (name == null || name.isEmpty()) {
                                  name = email.split("@")[0];
                              }
                              final String sEmail = email.replace("'", "\\'");
                              final String sName = name.replace("'", "\\'");
                              final String sToken = idToken != null ? idToken.replace("'", "\\'") : "";
                              runOnUiThread(() -> {
                                  if (webView != null) {
                                      webView.evaluateJavascript(
                                          "if(window.onZorenoNativeGoogleLogin){window.onZorenoNativeGoogleLogin('" + sEmail + "','" + sName + "','" + sToken + "');}",
                                          null
                                      );
                                  }
                              });
                          }
                      }
                  );
                  android.view.View rootContentView = findViewById(android.R.id.content);
                  if (rootContentView != null) {
                      rootContentView.setBackgroundColor(android.graphics.Color.BLACK);
                      androidx.core.view.ViewCompat.setOnApplyWindowInsetsListener(rootContentView, (v, insets) -> {
                          androidx.core.graphics.Insets bars = insets.getInsets(
                              androidx.core.view.WindowInsetsCompat.Type.systemBars() |
                              androidx.core.view.WindowInsetsCompat.Type.ime()
                          );
                          v.setBackgroundColor(android.graphics.Color.BLACK);
                          v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return androidx.core.view.WindowInsetsCompat.CONSUMED;
                      });
                      if (rootContentView instanceof android.view.ViewGroup) {
                          final android.view.ViewGroup rootGroup = (android.view.ViewGroup) rootContentView;
                          final android.widget.ImageView nativeSplash = new android.widget.ImageView(this);
                          nativeSplash.setImageResource(R.drawable.splash);
                          nativeSplash.setScaleType(android.widget.ImageView.ScaleType.CENTER_CROP);
                          nativeSplash.setBackgroundColor(android.graphics.Color.BLACK);
                          nativeSplash.setElevation(9999f);
                          rootGroup.addView(nativeSplash, new android.view.ViewGroup.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          nativeSplash.postDelayed(() -> {
                              nativeSplash.animate().alpha(0f).setDuration(350).withEndAction(() -> {
                                  if (nativeSplash.getParent() != null) {
                                      ((android.view.ViewGroup) nativeSplash.getParent()).removeView(nativeSplash);
                                  }
                              }).start();
                          }, 1400);
                      }
                  }
