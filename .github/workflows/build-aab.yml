name: Build Zoreno Android AAB & APK (v1.4.0 - Code 14)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build Zoreno Production v1.4.0 (Code 14)
        run: |
          ADMOB_APP_ID="ca-app-pub-5825754850490611~6362976717"
          ADMOB_BANNER_ID="ca-app-pub-5825754850490611/8792568001"
          ADMOB_REWARDED_ID="ca-app-pub-5825754850490611/4904670790"

          mkdir -p /tmp/zoreno_latest_backup
          [ -f "index.html" ] && cp -f index.html /tmp/zoreno_latest_backup/index.html || true
          [ -f "app.js" ] && cp -f app.js /tmp/zoreno_latest_backup/app.js || true
          [ -f "style.css" ] && cp -f style.css /tmp/zoreno_latest_backup/style.css || true

          rm -rf app build .gradle gradle libs.versions.toml
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" || true
          done

          [ -f "/tmp/zoreno_latest_backup/index.html" ] && cp -f /tmp/zoreno_latest_backup/index.html index.html || true
          [ -f "/tmp/zoreno_latest_backup/app.js" ] && cp -f /tmp/zoreno_latest_backup/app.js app.js || true
          [ -f "/tmp/zoreno_latest_backup/style.css" ] && cp -f /tmp/zoreno_latest_backup/style.css style.css || true
          rm -f *firebase-adminsdk*.json

          [ -f "index.html" ] && cp -f index.html index_912f1626.html || true
          [ -f "app.js" ] && cp -f app.js app_2ae41a74.js || true
          [ -f "style.css" ] && cp -f style.css style_bd461784.css || true

          PKG_NAME=""
          if [ -f "MainActivity.java" ]; then
            PKG_NAME=$(grep -oP '^package\s+\K[^;]+' MainActivity.java | tr -d '[:space:]' || true)
          fi
          [ -z "$PKG_NAME" ] && PKG_NAME="com.zoreno.app"
          PKG_DIR=$(echo "$PKG_NAME" | tr '.' '/')
          if [[ "$PKG_NAME" == com.example* ]]; then APP_ID="com.zoreno.app"; else APP_ID="$PKG_NAME"; fi

          mkdir -p "app/src/main/java/$PKG_DIR" app/src/main/assets app/src/main/res/layout app/src/main/res/values app/src/main/res/values-night app/src/main/res/values-v31 app/src/main/res/xml app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          cp *.java "app/src/main/java/$PKG_DIR/" 2>/dev/null || true
          [ -f "google-services.json" ] && cp -f google-services.json app/google-services.json || true
          cp *.html *.css *.js metadata.json *.png *.mp3 app/src/main/assets/ 2>/dev/null || true
          if [ -d "sounds" ]; then
            cp -r sounds app/src/main/assets/ || true
          else
            mkdir -p app/src/main/assets/sounds
            cp *.mp3 app/src/main/assets/sounds/ 2>/dev/null || true
          fi

          cp colors.xml strings.xml dimens.xml app/src/main/res/values/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp backup_rules.xml data_extraction_rules.xml network_security_config.xml file_paths.xml app/src/main/res/xml/ 2>/dev/null || true
          [ -f "proguard-rules.pro" ] && cp proguard-rules.pro app/ || true

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Zoreno</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_images" path="." />
              <external-cache-path name="ext_cache" path="." />
              <external-path name="external_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="ic_launcher_background">#FF7C3AED</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content><include domain="sharedpref" path="."/></full-backup-content>
          EOF

          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>
          EOF

          rm -f *"("*").webp" *.webp *.kt ic_launcher*.xml
          ICON_SRC="logo.png"
          [ -f "icon.png" ] && ICON_SRC="icon.png" || true
          [ -f "app_icon.png" ] && ICON_SRC="app_icon.png" || true

          if [ -f "$ICON_SRC" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f "$ICON_SRC" "app/src/main/res/$dir/ic_launcher.png"
              cp -f "$ICON_SRC" "app/src/main/res/$dir/ic_launcher_round.png"
            done
            cp -f "$ICON_SRC" app/src/main/res/drawable/logo.png
            cp -f "$ICON_SRC" app/src/main/res/drawable/ic_launcher_foreground.png
            cp -f "$ICON_SRC" app/src/main/assets/logo.png
            cp -f "$ICON_SRC" app/src/main/assets/icon.png
            [ ! -f "app/src/main/assets/default_avatar.png" ] && cp -f "$ICON_SRC" app/src/main/assets/default_avatar.png || true
          fi

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground_inset.xml
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/ic_launcher_foreground"
              android:insetLeft="16%"
              android:insetRight="16%"
              android:insetTop="16%"
              android:insetBottom="16%" />
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground_inset"/>
          </adaptive-icon>
          EOF
          cp -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/res/drawable/ic_empty_splash.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <size android:width="1dp" android:height="1dp"/>
              <solid android:color="#00000000"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_stat_zoreno.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M5,4h14v3.2L9.8,16.8H19V20H5v-3.2L14.2,7.2H5V4z"/>
          </vector>
          EOF

          if [ -f "splash.png" ]; then
            cp -f splash.png app/src/main/res/drawable/splash.png
            cp -f splash.png app/src/main/assets/splash.png
          elif [ -f "$ICON_SRC" ]; then
            cp -f "$ICON_SRC" app/src/main/res/drawable/splash.png
            cp -f "$ICON_SRC" app/src/main/assets/splash.png
          fi

          cat << 'EOF' > "app/src/main/java/$PKG_DIR/ZorenoNotifWorker.java"
          package __PKG_NAME__;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.BitmapFactory;
          import android.os.Build;
          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import androidx.work.Worker;
          import androidx.work.WorkerParameters;
          import com.google.gson.JsonArray;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class ZorenoNotifWorker extends Worker {
              public ZorenoNotifWorker(@NonNull Context context, @NonNull WorkerParameters params) {
                  super(context, params);
              }
              @NonNull @Override
              public Result doWork() {
                  checkNewMessages(getApplicationContext());
                  return Result.success();
              }
              public static String cleanPreview(String raw) {
                  if (raw == null || raw.trim().isEmpty()) return "";
                  String s = raw.trim();
                  if (s.contains("[[ANIM3D:") || s.contains("[[SVG3D:") || s.contains("[[STICKER") || s.contains("[[NEON")) return "Sent a 3D Sticker";
                  if (s.contains("[[VOICE:")) return "Voice Note";
                  if (s.contains("[[LOC:")) return "Shared a Location";
                  if (s.contains("[[MEMORY:")) return "Agreement Card";
                  return s.replaceAll("\\[\\[[^\\]]+\\]\\]", "").trim();
              }
              public static void checkNewMessages(Context ctx) {
                  try {
                      SharedPreferences prefs = ctx.getSharedPreferences("ZorenoQuotaPrefs", Context.MODE_PRIVATE);
                      String myUid = prefs.getString("zorenoActiveUid", "");
                      if (myUid == null || myUid.isEmpty()) return;
                      URL url = new URL("https://firestore.googleapis.com/v1/projects/zeraai-ans/databases/(default)/documents:runQuery");
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(6500);
                      conn.setReadTimeout(6500);
                      conn.setDoOutput(true);
                      String q = "{\"structuredQuery\":{\"from\":[{\"collectionId\":\"chats\"}],\"where\":{\"fieldFilter\":{\"field\":{\"fieldPath\":\"participants\"},\"op\":\"ARRAY_CONTAINS\",\"value\":{\"stringValue\":\"" + myUid + "\"}}}}}";
                      try (OutputStream os = conn.getOutputStream()) { os.write(q.getBytes("UTF-8")); }
                      if (conn.getResponseCode() == 200) {
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"))) {
                              String line; while ((line = br.readLine()) != null) sb.append(line);
                          }
                          JsonArray arr = JsonParser.parseString(sb.toString()).getAsJsonArray();
                          for (JsonElement el : arr) {
                              if (!el.isJsonObject()) continue;
                              JsonObject obj = el.getAsJsonObject();
                              if (!obj.has("document")) continue;
                              JsonObject doc = obj.getAsJsonObject("document");
                              if (!doc.has("fields")) continue;
                              JsonObject fields = doc.getAsJsonObject("fields");
                              String lastSenderId = getStr(fields, "lastSenderId");
                              String lastSenderName = getStr(fields, "lastSenderName");
                              String lastMsg = cleanPreview(getStr(fields, "lastMessage"));
                              long msgTimeMs = getInt(fields, "lastMessageAtMs");
                              if (!lastSenderId.isEmpty() && !lastSenderId.equals(myUid) && !lastMsg.isEmpty() && msgTimeMs > 0) {
                                  String nKey = "bgNotif_" + doc.get("name").getAsString();
                                  long prev = prefs.getLong(nKey, 0L);
                                  if (prev == 0L) {
                                      prefs.edit().putLong(nKey, msgTimeMs).apply();
                                  } else if (msgTimeMs > prev) {
                                      prefs.edit().putLong(nKey, msgTimeMs).apply();
                                      showNotif(ctx, lastSenderName.isEmpty() ? "Zoreno Message" : lastSenderName, lastMsg);
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }
              private static String getStr(JsonObject f, String k) {
                  try { if (f.has(k) && f.getAsJsonObject(k).has("stringValue")) return f.getAsJsonObject(k).get("stringValue").getAsString(); } catch (Exception ignored) {}
                  return "";
              }
              private static long getInt(JsonObject f, String k) {
                  try {
                      if (f.has(k)) {
                          JsonObject v = f.getAsJsonObject(k);
                          if (v.has("integerValue")) return Long.parseLong(v.get("integerValue").getAsString());
                          if (v.has("doubleValue")) return (long) v.get("doubleValue").getAsDouble();
                      }
                  } catch (Exception ignored) {}
                  return 0L;
              }
              public static void showNotif(Context ctx, String title, String body) {
                  try {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      String chId = "zoreno_dm_channel_v5";
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel(chId, "Zoreno Messages", NotificationManager.IMPORTANCE_HIGH);
                          ch.enableVibration(true);
                          nm.createNotificationChannel(ch);
                      }
                      Intent intent = new Intent(ctx, MainActivity.class);
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, chId)
                          .setSmallIcon(R.drawable.ic_stat_zoreno)
                          .setLargeIcon(BitmapFactory.decodeResource(ctx.getResources(), R.drawable.logo))
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setContentIntent(pi)
                          .setAutoCancel(true);
                      nm.notify((int) (System.currentTimeMillis() & 0xfffffff), b.build());
                  } catch (Exception ignored) {}
              }
          }
          EOF
          sed -i "s/__PKG_NAME__/$PKG_NAME/g" "app/src/main/java/$PKG_DIR/ZorenoNotifWorker.java"

          export ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_REWARDED_ID
          python3 - << 'PYEOF'
          import glob, os, re

          app_id = os.environ.get("ADMOB_APP_ID", "ca-app-pub-5825754850490611~6362976717")
          banner_id = os.environ.get("ADMOB_BANNER_ID", "ca-app-pub-5825754850490611/8792568001")
          rewarded_id = os.environ.get("ADMOB_REWARDED_ID", "ca-app-pub-5825754850490611/4904670790")

          # Inject V111.5 Tools Hub & Inside-Tools Top Status Bar Safe-Area Fix into unzipped CSS
          v111_tools_css = r"""
          /* ZORENO V111.5: FIX TOOLS HUB & INSIDE-TOOLS TOP STATUS BAR OVERLAP */
          html body #toolsScreen.tools-screen,
          html body:not(.ztool-subview-active) #toolsScreen.tools-screen,
          html body.ztool-subview-active #toolsScreen.tools-screen {
              padding-top: calc(14px + var(--zoreno-safe-top, 0px)) !important;
          }
          html body:not(.ztool-subview-active) #toolsScreen.tools-screen {
              padding-bottom: calc(96px + var(--zoreno-safe-bottom, 0px)) !important;
          }
          html body.ztool-subview-active #toolsScreen.tools-screen {
              padding-bottom: calc(24px + var(--zoreno-safe-bottom, 0px)) !important;
          }
          """
          for css_file in glob.glob("app/src/main/assets/style*.css"):
              with open(css_file, "r", encoding="utf-8", errors="ignore") as f:
                  csscode = f.read()
              if "ZORENO V111.5" not in csscode:
                  csscode = csscode + "\n" + v111_tools_css
                  with open(css_file, "w", encoding="utf-8") as f:
                      f.write(csscode)

          # Inject default split API key
          for js_file in glob.glob("app/src/main/assets/app*.js"):
              with open(js_file, "r", encoding="utf-8", errors="ignore") as f:
                  jscode = f.read()
              split_key_expr = 'localStorage.getItem("zorenoCloudApiKey") || ("AQ.Ab8RN6JD9hPTj4ql1" + "TKnZiiYYtgv48XVsjnBd" + "GSKXcga0gs5wA")'
              jscode = re.sub(
                  r'let\s+GEMINI_API_KEY\s*=\s*localStorage\.getItem\("zorenoCloudApiKey"\)\s*\|\|\s*""\s*;',
                  lambda m: f'let GEMINI_API_KEY = {split_key_expr};',
                  jscode
              )
              with open(js_file, "w", encoding="utf-8") as f:
                  f.write(jscode)

          for java_file in glob.glob("app/src/main/java/**/MainActivity.java", recursive=True):
              with open(java_file, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()
              code = re.sub(r'\.enablePendingPurchases\s*\(\s*\)', '.enablePendingPurchases(com.android.billingclient.api.PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())', code)
              code = re.sub(r'\bproductDetailsList\.isEmpty\s*\(\s*\)', 'productDetailsList.getProductDetailsList().isEmpty()', code)
              code = re.sub(r'\bproductDetailsList\.get\s*\(\s*0\s*\)', 'productDetailsList.getProductDetailsList().get(0)', code)

              def patch_override(m):
                  sig, var_name = m.group(1), m.group(2)
                  get_u = f"{var_name}.getUrl().toString()" if "WebResourceRequest" in sig else var_name
                  return sig + f"""
                  try {{
                      String _zu = {get_u};
                      if (_zu != null && (_zu.startsWith("intent:") || _zu.contains("google.com/maps") || _zu.contains("maps.app.goo.gl") || _zu.startsWith("geo:") || _zu.contains("tokoplatforms.in"))) {{
                          android.content.Intent _zi = _zu.startsWith("intent:")
                              ? android.content.Intent.parseUri(_zu, android.content.Intent.URI_INTENT_SCHEME)
                              : new android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(_zu));
                          _zi.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(_zi);
                          return true;
                      }}
                  }} catch (Exception _ze) {{ return true; }}
                  """
              code = re.sub(
                  r'(public\s+boolean\s+shouldOverrideUrlLoading\s*\(\s*WebView\s+\w+\s*,\s*(?:WebResourceRequest|String)\s+(\w+)\s*\)\s*\{)',
                  patch_override,
                  code
              )

              if "class MainActivity" in code:
                  code = re.sub(r'SplashScreen\.installSplashScreen\s*\(\s*this\s*\)\s*;', '', code)

                  extra_fields = r"""
                  private androidx.activity.result.ActivityResultLauncher<android.content.Intent> zorenoFileChooserLauncher;
                  private androidx.activity.result.ActivityResultLauncher<androidx.activity.result.IntentSenderRequest> zorenoUpdateLauncher;
                  private com.google.android.play.core.appupdate.AppUpdateManager zorenoAppUpdateManager;
                  private com.google.android.play.core.install.InstallStateUpdatedListener zorenoInstallListener;
                  private android.webkit.ValueCallback<android.net.Uri[]> zorenoFilePathCallback;
                  private android.net.Uri zorenoCameraPhotoUri;
                  private android.speech.tts.TextToSpeech zorenoTts;
                  private boolean zorenoTtsReady = false;
                  private android.media.MediaPlayer zorenoMediaPlayer;
                  private com.google.android.gms.ads.rewarded.RewardedAd zorenoRewardedAd;
                  private boolean zorenoRewardLoading = false;
                  private android.widget.FrameLayout zorenoBannerHost;
                  private com.google.android.gms.ads.AdView zorenoHomeBannerAd;
                  private boolean zorenoBannerLoaded = false;
                  private int zorenoBannerRetryCount = 0;
                  private int zorenoSafeTopCss = 0;
                  private int zorenoSafeBottomCss = 0;

                  private void checkPlayStoreInAppUpdate() {
                      try {
                          zorenoAppUpdateManager = com.google.android.play.core.appupdate.AppUpdateManagerFactory.create(MainActivity.this);
                          zorenoInstallListener = state -> {
                              if (state.installStatus() == com.google.android.play.core.install.model.InstallStatus.DOWNLOADED) {
                                  if (zorenoAppUpdateManager != null) zorenoAppUpdateManager.completeUpdate();
                              }
                          };
                          zorenoAppUpdateManager.registerListener(zorenoInstallListener);
                          zorenoAppUpdateManager.getAppUpdateInfo().addOnSuccessListener(info -> {
                              try {
                                  if (info.installStatus() == com.google.android.play.core.install.model.InstallStatus.DOWNLOADED) {
                                      zorenoAppUpdateManager.completeUpdate();
                                      return;
                                  }
                                  if (info.updateAvailability() == com.google.android.play.core.install.model.UpdateAvailability.UPDATE_AVAILABLE) {
                                      if (info.isUpdateTypeAllowed(com.google.android.play.core.install.model.AppUpdateType.FLEXIBLE)) {
                                          zorenoAppUpdateManager.startUpdateFlowForResult(
                                              info, zorenoUpdateLauncher,
                                              com.google.android.play.core.appupdate.AppUpdateOptions.newBuilder(
                                                  com.google.android.play.core.install.model.AppUpdateType.FLEXIBLE
                                              ).build()
                                          );
                                      } else if (info.isUpdateTypeAllowed(com.google.android.play.core.install.model.AppUpdateType.IMMEDIATE)) {
                                          zorenoAppUpdateManager.startUpdateFlowForResult(
                                              info, zorenoUpdateLauncher,
                                              com.google.android.play.core.appupdate.AppUpdateOptions.newBuilder(
                                                  com.google.android.play.core.install.model.AppUpdateType.IMMEDIATE
                                              ).build()
                                          );
                                      }
                                  }
                              } catch (Exception ignored) {}
                          });
                      } catch (Exception ignored) {}
                  }

                  private boolean isInstalledFromPlayStore() {
                      try {
                          String installer = (android.os.Build.VERSION.SDK_INT >= 30)
                              ? getPackageManager().getInstallSourceInfo(getPackageName()).getInstallingPackageName()
                              : getPackageManager().getInstallerPackageName(getPackageName());
                          return "com.android.vending".equals(installer) || "com.google.android.feedback".equals(installer);
                      } catch (Exception e) { return false; }
                  }

                  private void loadZorenoRewardedAd(String unitId) {
                      runOnUiThread(() -> {
                          if (zorenoRewardLoading || zorenoRewardedAd != null) return;
                          zorenoRewardLoading = true;
                          try {
                              String adUnit = (unitId != null && unitId.startsWith("ca-app-pub-")) ? unitId : "__REWARDED_ID__";
                              com.google.android.gms.ads.AdRequest adRequest = new com.google.android.gms.ads.AdRequest.Builder().build();
                              com.google.android.gms.ads.rewarded.RewardedAd.load(MainActivity.this, adUnit, adRequest, new com.google.android.gms.ads.rewarded.RewardedAdLoadCallback() {
                                  @Override public void onAdLoaded(com.google.android.gms.ads.rewarded.RewardedAd ad) {
                                      zorenoRewardLoading = false;
                                      zorenoRewardedAd = ad;
                                  }
                                  @Override public void onAdFailedToLoad(com.google.android.gms.ads.LoadAdError err) {
                                      zorenoRewardLoading = false;
                                      zorenoRewardedAd = null;
                                      new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> loadZorenoRewardedAd(adUnit), 10000);
                                  }
                              });
                          } catch (Exception ignored) { zorenoRewardLoading = false; }
                      });
                  }

                  private void ensureHomeBannerAd() {
                      if (zorenoBannerHost != null && zorenoHomeBannerAd != null) return;
                      try {
                          android.view.View root = findViewById(android.R.id.content);
                          if (!(root instanceof android.widget.FrameLayout)) return;
                          final float d = getResources().getDisplayMetrics().density;

                          zorenoBannerHost = new android.widget.FrameLayout(MainActivity.this);
                          zorenoBannerHost.setVisibility(android.view.View.GONE);
                          zorenoBannerHost.setElevation(120f);
                          zorenoBannerHost.setClipChildren(true);
