name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Package
        run: |
          unzip -o zorenoapp.zip || unzip -o ZorenoApp.zip || unzip -o *.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK & Release AAB
        run: |
          # ZorenoApp फोल्डर के अंदर जाकर डायरेक्ट gradle चलाएं
          cd ZorenoApp
          gradle assembleDebug bundleRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoreno-mobile-release-package
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
            
