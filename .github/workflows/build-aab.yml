          import android.content.Context;
          import android.content.Intent;
          public class ZorenoBootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  try { context.startService(new Intent(context, ZorenoBgNotifService.class)); } catch (Exception ignored) {}
              }
          }
          EOF

