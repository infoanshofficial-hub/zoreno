name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Setup Clean Project Structure, Auto-Patch Java/JS/HTML and Build
        run: |
          # 0. Purane build folders saaf karein aur agar zip hai toh extract karein
          rm -rf app build .gradle gradle libs.versions.toml
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" || true
          done

          # 1. MainActivity.java se exact package name nikalein
          PKG_NAME=""
          if [ -f "MainActivity.java" ]; then
            PKG_NAME=$(grep -oP '^package\s+\K[^;]+' MainActivity.java | tr -d '[:space:]' || true)
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.zoreno.app"
          fi
          PKG_DIR=$(echo "$PKG_NAME" | tr '.' '/')

          if [[ "$PKG_NAME" == com.example* ]]; then
            APP_ID="com.zoreno.app"
          else
            APP_ID="$PKG_NAME"
          fi
          echo "Detected Code Namespace: $PKG_NAME | Play Store App ID: $APP_ID"

          # 2. Sahi Android folders banayein
          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-xxhdpi

          # 3. Code, Manifest aur Web Assets move karein
          cp *.java "app/src/main/java/$PKG_DIR/" 2>/dev/null || true
          cp *.html *.css *.js metadata.json app/src/main/assets/ 2>/dev/null || true
          cp logo.png splash.png app/src/main/assets/ 2>/dev/null || true
          [ -d "sounds" ] && cp -r sounds app/src/main/assets/ || true

          # 4. XML aur Image Resources sahi folders me move karein
          cp colors.xml strings.xml dimens.xml app/src/main/res/values/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp backup_rules.xml data_extraction_rules.xml network_security_config.xml file_paths.xml app/src/main/res/xml/ 2>/dev/null || true

          rm -f *"("*").webp" *.kt
          cp ic_launcher_background.xml ic_launcher_foreground.xml logo.png splash.png app/src/main/res/drawable/ 2>/dev/null || true
          cp ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
          cp ic_launcher.webp ic_launcher_round.webp app/src/main/res/mipmap-xxhdpi/ 2>/dev/null || true
          [ -f "proguard-rules.pro" ] && cp proguard-rules.pro app/ || true

          # 5. AUTOMATIC JAVA PATCH: Black Status Bar, Native Google Sign-In Bridge, Splash, Razorpay Fallback & Billing 8.0.0 Fix
          python3 - << 'PYEOF'
          import glob, re

          for java_file in glob.glob("app/src/main/java/**/*.java", recursive=True):
              with open(java_file, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()

              # Auto-upgrade BillingClient 7.x methods to Billing 8.0.0 compatible methods
              code = re.sub(
                  r'\.enablePendingPurchases\s*\(\s*\)',
                  '.enablePendingPurchases(com.android.billingclient.api.PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())',
                  code
              )

              if "class MainActivity" in code:
                  code = re.sub(r'SplashScreen\.installSplashScreen\s*\(\s*this\s*\)\s*;', '', code)

                  # A. Add ActivityResultLauncher field for Native Google Account Picker inside MainActivity
                  launcher_field = """
                  private androidx.activity.result.ActivityResultLauncher<android.content.Intent> zorenoGoogleLauncher;
                  """
                  if "zorenoGoogleLauncher" not in code:
                      code = re.sub(
                          r'(class\s+MainActivity\s+extends\s+[^{]+\{)',
                          r'\1\n' + launcher_field,
                          code,
                          count=1
                      )

                  # B. Inject Pure Black Status/Nav Bar + Native Google Picker Result Handler + Splash Overlay
                  inset_and_google_code = """
                  androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().getDecorView().setBackgroundColor(android.graphics.Color.BLACK);
                  getWindow().setStatusBarColor(android.graphics.Color.BLACK);
                  getWindow().setNavigationBarColor(android.graphics.Color.BLACK);
                  androidx.core.view.WindowInsetsControllerCompat insetsCtrl =
                      androidx.core.view.WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (insetsCtrl != null) {
                      insetsCtrl.setAppearanceLightStatusBars(false);
                      insetsCtrl.setAppearanceLightNavigationBars(false);
                  }
                  zorenoGoogleLauncher = registerForActivityResult(
                      new androidx.activity.result.contract.ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          String email = null;
                          String name = null;
                          String idToken = null;
                          if (result.getData() != null) {
                              try {
                                  com.google.android.gms.tasks.Task<com.google.android.gms.auth.api.signin.GoogleSignInAccount> task =
                                      com.google.android.gms.auth.api.signin.GoogleSignIn.getSignedInAccountFromIntent(result.getData());
                                  com.google.android.gms.auth.api.signin.GoogleSignInAccount acct =
                                      task.getResult(com.google.android.gms.common.api.ApiException.class);
                                  if (acct != null) {
                                      email = acct.getEmail();
                                      name = acct.getDisplayName();
                                      idToken = acct.getIdToken();
                                  }
                              } catch (Exception ex) {
                                  email = result.getData().getStringExtra(android.accounts.AccountManager.KEY_ACCOUNT_NAME);
                              }
                              if (email == null) {
                                  email = result.getData().getStringExtra(android.accounts.AccountManager.KEY_ACCOUNT_NAME);
                              }
                          }
                          if (email != null && !email.isEmpty()) {
                              if (name == null || name.isEmpty()) {
                                  name = email.split("@")[0];
                              }
                              final String sEmail = email.replace("'", "\\'");
                              final String sName = name.replace("'", "\\'");
                              final String sToken = idToken != null ? idToken.replace("'", "\\'") : "";
                              runOnUiThread(() -> {
                                  if (webView != null) {
                                      webView.evaluateJavascript(
                                          "if(window.onZorenoNativeGoogleLogin){window.onZorenoNativeGoogleLogin('" + sEmail + "','" + sName + "','" + sToken + "');}",
                                          null
                                      );
                                  }
                              });
                          }
                      }
                  );
                  android.view.View rootContentView = findViewById(android.R.id.content);
                  if (rootContentView != null) {
                      rootContentView.setBackgroundColor(android.graphics.Color.BLACK);
                      androidx.core.view.ViewCompat.setOnApplyWindowInsetsListener(rootContentView, (v, insets) -> {
                          androidx.core.graphics.Insets bars = insets.getInsets(
                              androidx.core.view.WindowInsetsCompat.Type.systemBars() |
                              androidx.core.view.WindowInsetsCompat.Type.ime()
                          );
                          v.setBackgroundColor(android.graphics.Color.BLACK);
                          v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return androidx.core.view.WindowInsetsCompat.CONSUMED;
                      });
                      if (rootContentView instanceof android.view.ViewGroup) {
                          final android.view.ViewGroup rootGroup = (android.view.ViewGroup) rootContentView;
                          final android.widget.ImageView nativeSplash = new android.widget.ImageView(this);
                          nativeSplash.setImageResource(R.drawable.splash);
                          nativeSplash.setScaleType(android.widget.ImageView.ScaleType.CENTER_CROP);
                          nativeSplash.setBackgroundColor(android.graphics.Color.BLACK);
                          nativeSplash.setElevation(9999f);
                          rootGroup.addView(nativeSplash, new android.view.ViewGroup.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          nativeSplash.postDelayed(() -> {
                              nativeSplash.animate().alpha(0f).setDuration(350).withEndAction(() -> {
                                  if (nativeSplash.getParent() != null) {
                                      ((android.view.ViewGroup) nativeSplash.getParent()).removeView(nativeSplash);
                                  }
                              }).start();
                          }, 1400);
                      }
                  }
                  """
                  if "setOnApplyWindowInsetsListener(rootContentView" not in code:
                      code = re.sub(
                          r'(super\.onCreate\s*\([^)]*\)\s*;)',
                          r'\1\n' + inset_and_google_code,
                          code,
                          count=1
                      )

                  # C. Attach ZorenoGoogleAuth JavascriptInterface right after setJavaScriptEnabled(true)
                  js_bridge_code = """
                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void startGoogleLogin() {
                          runOnUiThread(() -> {
                              try {
                                  android.content.Intent pickIntent = com.google.android.gms.common.AccountPicker.newChooseAccountIntent(
                                      null, null, new String[]{"com.google"}, false, null, null, null, null
                                  );
                                  zorenoGoogleLauncher.launch(pickIntent);
                              } catch (Exception e) {
                                  try {
                                      com.google.android.gms.auth.api.signin.GoogleSignInOptions gso =
                                          new com.google.android.gms.auth.api.signin.GoogleSignInOptions.Builder(
                                              com.google.android.gms.auth.api.signin.GoogleSignInOptions.DEFAULT_SIGN_IN
                                          ).requestEmail().requestProfile().build();
                                      com.google.android.gms.auth.api.signin.GoogleSignInClient client =
                                          com.google.android.gms.auth.api.signin.GoogleSignIn.getClient(MainActivity.this, gso);
                                      zorenoGoogleLauncher.launch(client.getSignInIntent());
                                  } catch (Exception ex) {}
                              }
                          });
                      }
                  }, "ZorenoGoogleAuth");
                  """
                  if "ZorenoGoogleAuth" not in code:
                      code = re.sub(
                          r'(setJavaScriptEnabled\s*\(\s*true\s*\)\s*;)',
                          r'\1\n' + js_bridge_code,
                          code,
                          count=1
                      )

                  # D. Replace Play Console subscription error Toast with Razorpay fallback
                  code = re.sub(
                      r'Toast\.makeText\s*\([^;]*?(?:Subscription product not found|Play Console)[^;]*?\)\s*\.show\s*\(\s*\)\s*;',
                      r'runOnUiThread(() -> { if (webView != null) webView.evaluateJavascript("if(typeof window.triggerRazorpayFallback===\'function\'){window.triggerRazorpayFallback();}", null); });',
                      code,
                      flags=re.DOTALL
                  )

              with open(java_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Successfully auto-patched", java_file)
          PYEOF

          # 6. Clean themes.xml (Pure Black Status Bar & Navigation Bar)
          rm -f app/src/main/res/values/styles.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.Zoreno" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar" tools:targetApi="27">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:fitsSystemWindows">true</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:windowSplashScreenBackground" tools:targetApi="31">#000000</item>
              </style>
          </resources>
          EOF

          cp app/src/main/res/values/themes.xml app/src/main/res/values-night/themes.xml
          cp app/src/main/res/values/themes.xml app/src/main/res/values-v31/themes.xml

          # 7. AndroidManifest.xml me adjustResize aur Theme fix karein
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
            sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
            sed -i 's/android:theme="[^"]*"/android:theme="@style\/Theme.Zoreno"/g' app/src/main/AndroidManifest.xml
            if ! grep -q "windowSoftInputMode" app/src/main/AndroidManifest.xml; then
              sed -i 's/<activity /<activity android:windowSoftInputMode="adjustResize" /g' app/src/main/AndroidManifest.xml
            else
              sed -i 's/android:windowSoftInputMode="[^"]*"/android:windowSoftInputMode="adjustResize"/g' app/src/main/AndroidManifest.xml
            fi
          fi

          # 8. Zoreno Automatic CSS Fixes (Original Compact Layout + Google Button + Splash)
          cat << 'EOF' > app/src/main/assets/zoreno-fixes.css
          /* 1. Screen Fit & Safe Area Without Stretching Any Cards/Buttons */
          html, body {
              width: 100% !important;
              height: 100dvh !important;
              max-height: 100dvh !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow-x: hidden !important;
              box-sizing: border-box !important;
          }

          /* 2. Keyboard khulne par Chat Header gayab na ho */
          .chat-screen, .ai-chat-screen, #chat-container {
              display: flex !important;
              flex-direction: column !important;
              height: 100dvh !important;
              max-height: 100dvh !important;
              overflow: hidden !important;
          }
          .chat-header, header, .top-bar {
              flex-shrink: 0 !important;
              position: sticky !important;
              top: 0 !important;
              z-index: 100 !important;
          }
          .messages-container, .chat-messages, #messages {
              flex: 1 1 auto !important;
              overflow-y: auto !important;
              -webkit-overflow-scrolling: touch !important;
              padding-bottom: 12px !important;
          }
          .chat-input-bar, .input-area {
              flex-shrink: 0 !important;
              margin-bottom: env(safe-area-inset-bottom, 0px) !important;
          }

          /* 3. Bottom Floating Bar (4 Tabs) 3-Button Navigation se upar rahe */
          .bottom-nav, .floating-nav, nav.bottom-bar {
              bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
              z-index: 999 !important;
          }
          body.keyboard-open .bottom-nav,
          body.keyboard-open .floating-nav,
          body.keyboard-open nav.bottom-bar {
              display: none !important;
          }

          /* 4. Focus Music Mode Grid Spacing */
          .music-grid, .sounds-grid, .focus-music-list, [class*="music"] .grid {
              display: grid !important;
              grid-template-columns: repeat(2, 1fr) !important;
              gap: 10px !important;
              align-content: start !important;
              height: auto !important;
              flex: 0 0 auto !important;
              padding-bottom: 85px !important;
          }
          .music-card, .sound-item {
              padding: 12px 14px !important;
              min-height: 56px !important;
              max-height: 66px !important;
          }

          /* 5. Full Screen Custom Splash Screen Overlay */
          #zoreno-custom-splash {
              position: fixed;
              inset: 0;
              background: #000000 url('splash.png') no-repeat center center;
              background-size: cover;
              z-index: 999999;
              transition: opacity 0.35s ease;
          }

          /* 6. Official Google Sign-In Button Styling */
          .zoreno-google-btn-wrap {
              width: 100%;
              margin-top: 12px;
              margin-bottom: 8px;
              text-align: center;
          }
          .zoreno-or-divider {
              display: flex;
              align-items: center;
              text-align: center;
              color: #888;
              font-size: 12px;
              margin: 10px 0;
          }
          .zoreno-or-divider::before, .zoreno-or-divider::after {
              content: '';
              flex: 1;
              border-bottom: 1px solid #e0e0e0;
          }
          .zoreno-or-divider span {
              padding: 0 12px;
              font-weight: 600;
          }
          .zoreno-google-btn {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              width: 100%;
              padding: 12px 16px;
              background: #ffffff;
              color: #1f1f1f;
              border: 1px solid #dcdcdc;
              border-radius: 999px;
              font-size: 15px;
              font-weight: 600;
              cursor: pointer;
              box-shadow: 0 2px 8px rgba(0,0,0,0.05);
          }
          .zoreno-google-btn:active {
              transform: scale(0.98);
              background: #f5f5f5;
          }
          EOF

          # 9. Zoreno Automatic JS Fixes banayein
          cat << 'EOF' > app/src/main/assets/zoreno-fixes.js
          (function() {
              // --- A. SPLASH SCREEN OVERLAY ---
              let splash = document.getElementById('zoreno-custom-splash');
              if (!splash) {
                  splash = document.createElement('div');
                  splash.id = 'zoreno-custom-splash';
                  document.documentElement.appendChild(splash);
              }
              window.addEventListener('load', () => {
                  setTimeout(() => {
                      if (splash) {
                          splash.style.opacity = '0';
                          setTimeout(() => splash.remove(), 350);
                      }
                  }, 1000);
              });

              // --- B. KEYBOARD DETECTOR ---
              if (window.visualViewport) {
                  const initialHeight = window.visualViewport.height;
                  window.visualViewport.addEventListener('resize', () => {
                      if (window.visualViewport.height < initialHeight * 0.78) {
                          document.body.classList.add('keyboard-open');
                      } else {
                          document.body.classList.remove('keyboard-open');
                      }
                  });
              }

              // --- C. AUTO-FIX AMAZON AFFILIATE LINKS ---
              document.addEventListener('click', function(e) {
                  const buyEl = e.target.closest('a, button');
                  if (!buyEl) return;
                  const btnText = (buyEl.innerText || '').trim().toLowerCase();
                  const href = buyEl.getAttribute('href') || '';
                  if (btnText.includes('buy') || href.includes('amazon') || href.includes('amzn')) {
                      let affiliateTag = 'zoreno-21';
                      const scriptsText = Array.from(document.querySelectorAll('script')).map(s => s.innerHTML).join(' ');
                      const tagMatch = scriptsText.match(/tag=([a-zA-Z0-9_-]+-21)/);
                      if (tagMatch && tagMatch[1]) affiliateTag = tagMatch[1];

                      const card = buyEl.closest('div');
                      let productTitle = 'Study Stationery Pen Notebook';
                      if (card) {
                          const lines = card.innerText.split('\n').map(l => l.trim()).filter(Boolean);
                          const filtered = lines.filter(l => !l.toUpperCase().includes('RECOMMENDED') && !l.toLowerCase().includes('buy') && !l.toLowerCase().includes('best for'));
                          if (filtered.length > 0) productTitle = filtered[0];
                      }

                      if (!href || href === '#' || href.includes('undefined') || href.includes('amzn.to') || !href.includes('amazon.in/dp/')) {
                          e.preventDefault();
                          e.stopPropagation();
                          const safeAmazonUrl = 'https://www.amazon.in/s?k=' + encodeURIComponent(productTitle) + '&tag=' + affiliateTag;
                          window.open(safeAmazonUrl, '_blank');
                      }
                  }
              }, true);

              // --- D. COMPLETE LATEX / MATH SYNTAX CLEANER ---
              const supMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','n':'ⁿ'};
              const subMap = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','k':'ₖ','s':'ₛ','i':'ᵢ','m':'ₘ'};
              const toSup = s => s.split('').map(c => supMap[c] || c).join('');
              const toSub = s => s.split('').map(c => subMap[c] || c).join('');

              function cleanMathText(text) {
                  if (!text || typeof text !== 'string') return text;
                  return text
                      .replace(/\\\$/g, '')
                      .replace(/\$\$/g, '')
                      .replace(/\$/g, '')
                      .replace(/\\\[|\\\]|\\\(|\\\)/g, '')
                      .replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1/$2)')
                      .replace(/\\sqrt\s*\{([^{}]+)\}/g, '√($1)')
                      .replace(/\\(?:text|mathrm|mathbf|mathit|textbf|textit|textrm)\s*\{([^{}]*)\}/g, '$1')
                      .replace(/\\triangle/g, 'Δ')
                      .replace(/\\Delta/g, 'Δ')
                      .replace(/\\angle/g, '∠')
                      .replace(/\^\{?\\circ\}?/g, '°')
                      .replace(/\\circ/g, '°')
                      .replace(/\^°/g, '°')
                      .replace(/\\mu_k/g, 'μₖ')
                      .replace(/\\mu_s/g, 'μₛ')
                      .replace(/\\mu/g, 'μ')
                      .replace(/\\tau/g, 'τ')
                      .replace(/\\alpha/g, 'α')
                      .replace(/\\beta/g, 'β')
                      .replace(/\\gamma/g, 'γ')
                      .replace(/\\theta/g, 'θ')
                      .replace(/\\lambda/g, 'λ')
                      .replace(/\\omega/g, 'ω')
                      .replace(/\\pi/g, 'π')
                      .replace(/\\infty/g, '∞')
                      .replace(/\\Rightarrow/g, '⇒')
                      .replace(/\\rightarrow|\\to/g, '→')
                      .replace(/\\cdot/g, '·')
                      .replace(/\\times/g, '×')
                      .replace(/\\div/g, '÷')
                      .replace(/\\pm/g, '±')
                      .replace(/\\leq|\\le/g, '≤')
                      .replace(/\\geq|\\ge/g, '≥')
                      .replace(/\\neq|\\ne/g, '≠')
                      .replace(/\\approx/g, '≈')
                      .replace(/\^\{([0-9+\-n]+)\}/g, (_, p1) => toSup(p1))
                      .replace(/\^([0-9])/g, (_, p1) => toSup(p1))
                      .replace(/_\{([0-9ksim]+)\}/g, (_, p1) => toSub(p1))
                      .replace(/_([0-9ksim])\b/g, (_, p1) => toSub(p1))
                      .replace(/\\([a-zA-Z]+)\b/g, '$1')
                      .replace(/[\u4e00-\u9fff]+/g, 'स्लाइडिंग (Sliding)');
              }

              // --- E. AI FETCH INTERCEPTOR ---
              const origFetch = window.fetch;
              window.fetch = async function(url, options) {
                  const isAiCall = typeof url === 'string' && (
                      url.includes('generativelanguage') ||
                      url.includes('openai') ||
                      url.includes('groq') ||
                      url.includes('openrouter') ||
                      url.includes('chat') ||
                      url.includes('completions')
                  );
                  if (isAiCall && options && options.body) {
                      try {
                          let body = JSON.parse(options.body);
                          const expertRule = "IMPORTANT: You are Zoreno AI, an expert tutor for NEET, IIT-JEE, UPSC and school exams. Solve Physics, Chemistry, Math and Biology problems step-by-step with clear calculations. STRICT RULE: NEVER use LaTeX dollar signs ($), \\text{}, \\frac{}{}, or \\times. Write plain Unicode math like: a = 2 m/s², v = u + at, s = ut + (1/2)at², (2 × 5) = 10 m/s, ΔABC, ∠A = 70°, √x.";
                          if (body.generationConfig) {
                              body.generationConfig.maxOutputTokens = 2048;
                          } else if (body.contents) {
                              body.generationConfig = { maxOutputTokens: 2048, temperature: 0.7 };
                          }
                          if (body.max_tokens) {
                              body.max_tokens = 2048;
                          }
                          if (body.systemInstruction && body.systemInstruction.parts) {
                              body.systemInstruction.parts[0].text += "\n" + expertRule;
                          }
                          options.body = JSON.stringify(body);
                      } catch (err) {}
                  }
                  const response = await origFetch.apply(this, arguments);
                  if (isAiCall && response) {
                      const origJson = response.json.bind(response);
                      response.json = async function() {
                          const data = await origJson();
                          try {
                              if (data && data.candidates) {
                                  data.candidates.forEach(c => {
                                      if (c.content && c.content.parts) {
                                          c.content.parts.forEach(p => {
                                              if (p.text) p.text = cleanMathText(p.text);
                                          });
                                      }
                                  });
                              }
                              if (data && data.choices) {
                                  data.choices.forEach(ch => {
                                      if (ch.message && ch.message.content) {
                                          ch.message.content = cleanMathText(ch.message.content);
                                      }
                                  });
                              }
                          } catch (e) {}
                          return data;
                      };
                  }
                  return response;
              };

              // --- F. NATIVE GOOGLE LOGIN CALLBACK HANDLER ---
              window.onZorenoNativeGoogleLogin = async function(email, displayName, idToken) {
                  if (!email) return;
                  try {
                      if (window.firebase && firebase.auth) {
                          if (idToken) {
                              try {
                                  const cred = firebase.auth.GoogleAuthProvider.credential(idToken);
                                  await firebase.auth().signInWithCredential(cred);
                                  return;
                              } catch (err) {}
                          }
                          const googlePass = 'ZorenoGoogle#' + email.toLowerCase();
                          try {
                              await firebase.auth().signInWithEmailAndPassword(email, googlePass);
                          } catch (signInErr) {
                              if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential' || signInErr.code === 'auth/wrong-password') {
                                  try {
                                      const userCred = await firebase.auth().createUserWithEmailAndPassword(email, googlePass);
                                      if (userCred.user && displayName) {
                                          await userCred.user.updateProfile({ displayName: displayName });
                                      }
                                  } catch (createErr) {
                                      const emailInput = document.querySelector('input[type="email"], input[placeholder*="Email" i]');
                                      if (emailInput) {
                                          emailInput.value = email;
                                          emailInput.dispatchEvent(new Event('input', { bubbles: true }));
                                      }
                                      alert('Yeh Google email (' + email + ') pehle se password ke sath juda hai. Kripya apna password dalkar Login dabayein.');
                                  }
                              }
                          }
                      }
                  } catch (e) {}
              };

              // --- G. RAZORPAY FALLBACK ---
              window.triggerRazorpayFallback = function() {
                  if (typeof window.openRazorpay === 'function') {
                      window.openRazorpay();
                  } else if (typeof window.startRazorpayPayment === 'function') {
                      window.startRazorpayPayment();
                  } else if (window.Razorpay) {
                      const upgBtn = document.querySelector('[class*="upgrade"], button');
                      if (upgBtn) upgBtn.click();
                  }
              };

              // --- H. SAFE SETTINGS SCROLL UNLOCKER (NO STRETCHING) ---
              function enableSettingsSmoothScroll() {
                  const allEls = document.querySelectorAll('h1, h2, h3, div, span');
                  for (let i = 0; i < allEls.length; i++) {
                      const el = allEls[i];
                      if (el.children.length === 0 && (el.innerText || '').trim() === 'Settings') {
                          let container = el.parentElement;
                          while (container && container !== document.body) {
                              const txt = container.innerText || '';
                              if (txt.includes('APPEARANCE') && txt.includes('LEGAL & POLICIES')) {
                                  container.style.setProperty('overflow-y', 'auto', 'important');
                                  container.style.setProperty('max-height', '100dvh', 'important');
                                  container.style.setProperty('-webkit-overflow-scrolling', 'touch', 'important');
                                  if (!container.querySelector('#zoreno-settings-bottom-spacer')) {
                                      const spacer = document.createElement('div');
                                      spacer.id = 'zoreno-settings-bottom-spacer';
                                      spacer.style.cssText = 'height: 115px; width: 100%; flex-shrink: 0; pointer-events: none;';
                                      container.appendChild(spacer);
                                  }
                                  break;
                              }
                              container = container.parentElement;
                          }
                          break;
                      }
                  }
              }

              // --- I. HELPER: CHECK IF ELEMENT IS INSIDE FOCUS SPRINT TIMER OR FOCUS MUSIC ---
              function isTimerOrMusicElement(el) {
                  const fontSize = parseFloat(window.getComputedStyle(el).fontSize || '12');
                  if (fontSize >= 15) return true;
                  let p = el;
                  let depth = 0;
                  while (p && p !== document.body && depth < 7) {
                      const t = p.innerText || '';
                      const cls = (p.className && typeof p.className === 'string') ? p.className.toLowerCase() : '';
                      if (
                          t.includes('Focus Sprint') ||
                          t.includes('keep the sprint alive') ||
                          t.includes('Focus Music') ||
                          t.includes('Stay calm') ||
                          t.includes('Rain Storm') ||
                          t.includes('Forest Birds') ||
                          t.includes('Deep Lo-Fi') ||
                          cls.includes('timer') ||
                          cls.includes('sprint') ||
                          cls.includes('music') ||
                          cls.includes('player')
                      ) {
                          return true;
                      }
                      p = p.parentElement;
                      depth++;
                  }
                  return false;
              }

              // --- J. DOM OBSERVER: MATH CLEANER, SETTINGS SCROLL, DELETE FOR ME, GOOGLE BTN & TIME ---
              const observer = new MutationObserver(() => {
                  // 1. Clean LaTeX/Math in all text nodes
                  if (document.body) {
                      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                      let node;
                      while ((node = walker.nextNode())) {
                          const val = node.nodeValue;
                          if (val && (val.includes('$') || val.includes('\\text') || val.includes('\\frac') || val.includes('\\times') || val.includes('\\sqrt') || val.includes('\\mu') || val.includes('\\triangle') || val.includes('^2') || val.includes('^3'))) {
                              const parentTag = node.parentNode ? node.parentNode.tagName : '';
                              if (parentTag !== 'SCRIPT' && parentTag !== 'STYLE') {
                                  const cleaned = cleanMathText(val);
                                  if (cleaned !== val) node.nodeValue = cleaned;
                              }
                          }
                      }
                  }

                  // 2. Smooth Settings Scroll without stretching layout
                  enableSettingsSmoothScroll();

                  // 3. Replace Boy Photo with Zoreno logo.png for Zoreno AI Official
                  document.querySelectorAll('img').forEach(img => {
                      const block = img.closest('div, li, header');
                      const blockTxt = block ? (block.innerText || '') : '';
                      if (blockTxt.includes('Zoreno AI') && !img.src.includes('logo.png')) {
                          img.src = 'logo.png';
                      }
                  });

                  // 4. Clean any accidental AM/PM on Focus Sprint & Focus Music, and format only Chat timestamps
                  document.querySelectorAll('span, small, div, p').forEach(el => {
                      if (el.children.length === 0 && el.innerText) {
                          const txt = el.innerText.trim();
                          if (isTimerOrMusicElement(el)) {
                              const ampmMatch = txt.match(/^(\d{2}):(\d{2})\s*(AM|PM)$/i);
                              if (ampmMatch) {
                                  let h = parseInt(ampmMatch[1], 10);
                                  const m = ampmMatch[2];
                                  const ap = ampmMatch[3].toUpperCase();
                                  if (ap === 'PM' && h < 12) h += 12;
                                  if (ap === 'AM' && h === 12) h = 0;
                                  el.innerText = String(h).padStart(2, '0') + ':' + m;
                              }
                              return;
                          }
                          const match24 = txt.match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
                          if (match24) {
                              let h = parseInt(match24[1], 10);
                              const m = match24[2];
                              const ampm = h >= 12 ? 'PM' : 'AM';
                              h = h % 12 || 12;
                              el.innerText = String(h).padStart(2, '0') + ':' + m + ' ' + ampm;
                          }
                      }
                  });

                  // 5. Fix "Delete Message?" Modal: Always show "Delete for Me" next to "Cancel" on Received/AI Messages
                  document.querySelectorAll('button, a, div').forEach(btn => {
                      if (btn.children.length === 0 && (btn.innerText || '').trim() === 'Cancel') {
                          const modal = btn.closest('div')?.parentElement;
                          if (modal && (modal.innerText || '').includes('Delete Message')) {
                              const siblingBtns = Array.from(btn.parentElement.querySelectorAll('button, a'));
                              let delBtn = siblingBtns.find(b => b !== btn);
                              if (delBtn) {
                                  delBtn.style.display = '';
                                  if (window.__lastSelectedMsgIsIncoming === true) {
                                      if (delBtn.innerText.trim() !== 'Delete for Me') {
                                          delBtn.innerText = 'Delete for Me';
                                      }
                                      if (!delBtn.dataset.zorenoDeleteMeBound) {
                                          delBtn.dataset.zorenoDeleteMeBound = '1';
                                          delBtn.addEventListener('click', () => {
                                              if (window.__lastSelectedMsgBubble) {
                                                  window.__lastSelectedMsgBubble.style.display = 'none';
                                              }
                                              btn.click();
                                          });
                                      }
                                  } else {
                                      if (delBtn.innerText.trim() === 'Delete for Me') {
                                          delBtn.innerText = 'Delete for Everyone';
                                      }
                                  }
                              } else {
                                  btn.parentElement.style.display = 'flex';
                                  btn.parentElement.style.gap = '10px';
                                  const newDelBtn = document.createElement('button');
                                  newDelBtn.type = 'button';
                                  newDelBtn.innerText = 'Delete for Me';
                                  newDelBtn.style.cssText = 'flex:1; padding:12px 16px; border:none; border-radius:14px; background:#ef4444; color:#ffffff; font-weight:600; font-size:15px; cursor:pointer;';
                                  newDelBtn.addEventListener('click', () => {
                                      if (window.__lastSelectedMsgBubble) {
                                          window.__lastSelectedMsgBubble.style.display = 'none';
                                      }
                                      btn.click();
                                  });
                                  btn.parentElement.appendChild(newDelBtn);
                              }
                          }
                      }
                  });

                  // 6. Add Working "Continue with Google" Button Below Login Button
                  const buttons = Array.from(document.querySelectorAll('button'));
                  const loginBtn = buttons.find(b => b.innerText && b.innerText.trim().startsWith('Login'));
                  if (loginBtn && !document.getElementById('zoreno-google-login-btn')) {
                      const wrap = document.createElement('div');
                      wrap.className = 'zoreno-google-btn-wrap';
                      wrap.innerHTML = `
                          <div class="zoreno-or-divider"><span>OR</span></div>
                          <button type="button" id="zoreno-google-login-btn" class="zoreno-google-btn">
                              <svg width="20" height="20" viewBox="0 0 48 48">
                                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                              </svg>
                              <span>Continue with Google</span>
                          </button>
                      `;
                      loginBtn.parentNode.insertBefore(wrap, loginBtn.nextSibling);
                      document.getElementById('zoreno-google-login-btn').addEventListener('click', () => {
                          if (window.ZorenoGoogleAuth && typeof window.ZorenoGoogleAuth.startGoogleLogin === 'function') {
                              window.ZorenoGoogleAuth.startGoogleLogin();
                          } else if (window.Android && typeof window.Android.signInWithGoogle === 'function') {
                              window.Android.signInWithGoogle();
                          } else if (typeof window.signInWithGoogle === 'function') {
                              window.signInWithGoogle();
                          }
                      });
                  }
              });

              observer.observe(document.documentElement, { childList: true, subtree: true });

              // Track clicked message bubble for "Delete for Me" vs "Delete for Everyone"
              const checkMsgOwner = function(e) {
                  const bubble = e.target.closest('[class*="msg"], [class*="message"], [class*="bubble"]');
                  if (bubble) {
                      window.__lastSelectedMsgBubble = bubble;
                      const cls = (bubble.className || '').toLowerCase();
                      const rect = bubble.getBoundingClientRect();
                      const isRightAligned = rect.left > (window.innerWidth * 0.25);
                      window.__lastSelectedMsgIsIncoming = !(cls.includes('sent') || cls.includes('out') || cls.includes('self') || cls.includes('me') || isRightAligned);
                  }
              };
              document.addEventListener('contextmenu', checkMsgOwner, true);
              document.addEventListener('touchstart', checkMsgOwner, true);
              document.addEventListener('mousedown', checkMsgOwner, true);
          })();
          EOF

          # 10. Inject zoreno-fixes.css, inline splash div, and zoreno-fixes.js into all HTML files
          for htmlfile in app/src/main/assets/*.html; do
            if [ -f "$htmlfile" ]; then
              sed -i 's/<\/head>/<link rel="stylesheet" href="zoreno-fixes.css"><\/head>/i' "$htmlfile"
              sed -i 's/<body[^>]*>/&<div id="zoreno-custom-splash"><\/div>/i' "$htmlfile"
              sed -i 's/<\/body>/<script src="zoreno-fixes.js"><\/script><\/body>/i' "$htmlfile"
            fi
          done

          # 11. Play Store ke liye Release Keystore generate karein
          rm -f app/zoreno-release-key.jks
          keytool -genkeypair -v \
            -keystore app/zoreno-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zoreno \
            -storepass Zoreno@2026 \
            -keypass Zoreno@2026 \
            -dname "CN=Zoreno, OU=Mobile, O=Toko Platforms Private Limited, L=Varanasi, S=UP, C=IN"

          cat << 'EOF' > keystore-details.txt
          Keystore File: zoreno-release-key.jks
          Key Alias: zoreno
          Store Password: Zoreno@2026
          Key Password: Zoreno@2026
          (Play Store par agle updates dalne ke liye is file aur password ko sambhal kar rakhein)
          EOF

          # 12. Clean gradle.properties, settings.gradle.kts & build.gradle.kts
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=36
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Zoreno"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "$PKG_NAME"
              compileSdk = 36

              defaultConfig {
                  applicationId = "$APP_ID"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 3
                  versionName = "1.0.2"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("zoreno-release-key.jks")
                      storePassword = "Zoreno@2026"
                      keyAlias = "zoreno"
                      keyPassword = "Zoreno@2026"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity:1.9.3")
              implementation("androidx.core:core:1.13.1")
              implementation("androidx.constraintlayout:constraintlayout:2.2.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("com.google.android.gms:play-services-ads:23.6.0")
              implementation("com.google.android.gms:play-services-auth:21.2.0")
              implementation("com.android.billingclient:billing:8.0.0")
              implementation("com.google.code.gson:gson:2.11.0")
              implementation("androidx.browser:browser:1.8.0")
          }
          EOF

          echo "Running Clean Gradle Build..."
          gradle assembleDebug assembleRelease bundleRelease -x lint -x lintDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zoreno-mobile-release-package
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            app/zoreno-release-key.jks
            keystore-details.txt
