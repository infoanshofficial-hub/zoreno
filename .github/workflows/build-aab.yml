                                  try (java.io.FileOutputStream fos = new java.io.FileOutputStream(new java.io.File(dir, safeName))) { fos.write(bytes); }
                              }
                              runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this, isImg ? "Saved to Gallery (Pictures/Zoreno)" : "Saved to Downloads/Zoreno", android.widget.Toast.LENGTH_SHORT).show());
                          } catch (Exception ignored) {}
