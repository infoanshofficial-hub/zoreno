name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Setup Clean Project Structure, Auto-Patch Java/JS/HTML and Build
        run: |
          # 0. Sabse pehle repo ki latest HTML/CSS/JS ko backup karein taaki zip ki purani files unhe overwrite na karein!
          mkdir -p /tmp/zoreno_latest_backup
          [ -f "index.html" ] && cp -f index.html /tmp/zoreno_latest_backup/index.html || true
          [ -f "app.js" ] && cp -f app.js /tmp/zoreno_latest_backup/app.js || true
          [ -f "style.css" ] && cp -f style.css /tmp/zoreno_latest_backup/style.css || true

          rm -rf app build .gradle gradle libs.versions.toml
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" || true
          done

          # Backup ki hui latest files wapas restore karein
          [ -f "/tmp/zoreno_latest_backup/index.html" ] && cp -f /tmp/zoreno_latest_backup/index.html index.html || true
          [ -f "/tmp/zoreno_latest_backup/app.js" ] && cp -f /tmp/zoreno_latest_backup/app.js app.js || true
          [ -f "/tmp/zoreno_latest_backup/style.css" ] && cp -f /tmp/zoreno_latest_backup/style.css style.css || true

          rm -f *firebase-adminsdk*.json

          # Hashed duplicate files ko bhi latest code se sync karein
          [ -f "index.html" ] && cp -f index.html index_912f1626.html || true
          [ -f "app.js" ] && cp -f app.js app_2ae41a74.js || true
          [ -f "style.css" ] && cp -f style.css style_bd461784.css || true

          # 1. MainActivity.java se exact package name nikalein
          PKG_NAME=""
          if [ -f "MainActivity.java" ]; then
            PKG_NAME=$(grep -oP '^package\s+\K[^;]+' MainActivity.java | tr -d '[:space:]' || true)
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.zoreno.app"
          fi
          PKG_DIR=$(echo "$PKG_NAME" | tr '.' '/')

          if [[ "$PKG_NAME" == com.example* ]]; then
            APP_ID="com.zoreno.app"
          else
            APP_ID="$PKG_NAME"
          fi
          echo "Detected Code Namespace: $PKG_NAME | Play Store App ID: $APP_ID"

          # 2. Sahi Android folders banayein
          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 3. Code, Manifest aur Web Assets move karein
          cp *.java "app/src/main/java/$PKG_DIR/" 2>/dev/null || true
          cp *.html *.css *.js metadata.json app/src/main/assets/ 2>/dev/null || true
          cp *.png app/src/main/assets/ 2>/dev/null || true
          [ -d "sounds" ] && cp -r sounds app/src/main/assets/ || true

          # 4. XML Resources move karein
          cp colors.xml strings.xml dimens.xml app/src/main/res/values/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp backup_rules.xml data_extraction_rules.xml network_security_config.xml file_paths.xml app/src/main/res/xml/ 2>/dev/null || true
          [ -f "proguard-rules.pro" ] && cp proguard-rules.pro app/ || true

          # Official App Name "Zoreno"
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Zoreno</string>
          </resources>
          EOF

          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="sharedpref" path="."/>
          </full-backup-content>
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="sharedpref" path="."/>
              </cloud-backup>
          </data-extraction-rules>
          EOF
          fi

          # 4B. ICON & SPLASH FIX
          rm -f *"("*").webp" *.webp *.kt ic_launcher*.xml

          ICON_SRC="logo.png"
          if [ -f "icon.png" ]; then
            ICON_SRC="icon.png"
          elif [ -f "app_icon.png" ]; then
            ICON_SRC="app_icon.png"
          fi

          if [ -f "$ICON_SRC" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f "$ICON_SRC" "app/src/main/res/$dir/ic_launcher.png"
              cp -f "$ICON_SRC" "app/src/main/res/$dir/ic_launcher_round.png"
            done
            cp -f "$ICON_SRC" app/src/main/res/drawable/logo.png
            cp -f "$ICON_SRC" app/src/main/res/drawable/ic_launcher_foreground.png
            cp -f "$ICON_SRC" app/src/main/assets/logo.png
            cp -f "$ICON_SRC" app/src/main/assets/icon.png
            if [ ! -f "app/src/main/assets/default_avatar.png" ]; then
              cp -f "$ICON_SRC" app/src/main/assets/default_avatar.png
            fi
          fi

          if [ -f "splash.png" ]; then
            cp -f splash.png app/src/main/res/drawable/splash.png
            cp -f splash.png app/src/main/assets/splash.png
          elif [ -f "$ICON_SRC" ]; then
            cp -f "$ICON_SRC" app/src/main/res/drawable/splash.png
            cp -f "$ICON_SRC" app/src/main/assets/splash.png
          fi

          # 5. AUTOMATIC PYTHON PATCH FOR JAVA & APP.JS (Fixes Google Play Billing, AI Key, Profile, Groups, AndroidTTS Voice & Notifications)
          python3 - << 'PYEOF'
          import glob, re

          # --- A. PATCH APP.JS IN ASSETS ---
          for js_file in glob.glob("app/src/main/assets/app*.js"):
              with open(js_file, "r", encoding="utf-8", errors="ignore") as f:
                  jscode = f.read()

              # 1. Inject Split Default API Key so AI works out-of-the-box without GitHub leak
              split_key_expr = 'localStorage.getItem("zorenoCloudApiKey") || ("AQ.Ab8RN6JD9hPTj4ql1" + "TKnZiiYYtgv48XVsjnBd" + "GSKXcga0gs5wA")'
              jscode = re.sub(
                  r'let\s+GEMINI_API_KEY\s*=\s*localStorage\.getItem\("zorenoCloudApiKey"\)\s*\|\|\s*""\s*;',
                  f'let GEMINI_API_KEY = {split_key_expr};',
                  jscode
              )

              # 2. Force Google Play Billing directly when AndroidBilling bridge exists (Never jump to Razorpay in Play Store app!)
              jscode = re.sub(
                  r'const\s+isPlayStoreInstall\s*=[\s\S]*?if\s*\(\s*isPlayStoreInstall\s*&&\s*window\.AndroidBilling\s*&&\s*typeof\s+window\.AndroidBilling\.purchaseSubscription\s*===\s*"function"\s*\)\s*\{',
                  'if (window.AndroidBilling && typeof window.AndroidBilling.purchaseSubscription === "function") {',
                  jscode
              )

              with open(js_file, "w", encoding="utf-8") as f:
                  f.write(jscode)
              print("Patched JS file:", js_file)

          # --- B. PATCH MAINACTIVITY.JAVA ---
          for java_file in glob.glob("app/src/main/java/**/*.java", recursive=True):
              with open(java_file, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()

              code = re.sub(
                  r'\.enablePendingPurchases\s*\(\s*\)',
                  '.enablePendingPurchases(com.android.billingclient.api.PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())',
                  code
              )
              code = re.sub(
                  r'\bproductDetailsList\.isEmpty\s*\(\s*\)',
                  'productDetailsList.getProductDetailsList().isEmpty()',
                  code
              )
              code = re.sub(
                  r'\bproductDetailsList\.get\s*\(\s*0\s*\)',
                  'productDetailsList.getProductDetailsList().get(0)',
                  code
              )

              if "class MainActivity" in code:
                  code = re.sub(r'SplashScreen\.installSplashScreen\s*\(\s*this\s*\)\s*;', '', code)

                  extra_fields = """
                  private androidx.activity.result.ActivityResultLauncher<android.content.Intent> zorenoGoogleLauncher;
                  private android.speech.tts.TextToSpeech zorenoTts;
                  private boolean zorenoTtsReady = false;
                  """
                  if "zorenoGoogleLauncher" not in code:
                      code = re.sub(
                          r'(class\s+MainActivity\s+extends\s+[^{]+\{)',
                          r'\1\n' + extra_fields,
                          code,
                          count=1
                      )

                  inset_and_google_code = """
                  androidx.core.view.WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().getDecorView().setBackgroundColor(android.graphics.Color.BLACK);
                  getWindow().setStatusBarColor(android.graphics.Color.BLACK);
                  getWindow().setNavigationBarColor(android.graphics.Color.BLACK);
                  androidx.core.view.WindowInsetsControllerCompat insetsCtrl =
                      androidx.core.view.WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (insetsCtrl != null) {
                      insetsCtrl.setAppearanceLightStatusBars(false);
                      insetsCtrl.setAppearanceLightNavigationBars(false);
                  }
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 101);
                  }
                  zorenoTts = new android.speech.tts.TextToSpeech(getApplicationContext(), status -> {
                      if (status == android.speech.tts.TextToSpeech.SUCCESS) {
                          zorenoTtsReady = true;
                      }
                  });
                  zorenoGoogleLauncher = registerForActivityResult(
                      new androidx.activity.result.contract.ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          String email = null;
                          String name = null;
                          String idToken = null;
                          if (result.getData() != null) {
                              try {
                                  com.google.android.gms.tasks.Task<com.google.android.gms.auth.api.signin.GoogleSignInAccount> task =
                                      com.google.android.gms.auth.api.signin.GoogleSignIn.getSignedInAccountFromIntent(result.getData());
                                  com.google.android.gms.auth.api.signin.GoogleSignInAccount acct =
                                      task.getResult(com.google.android.gms.common.api.ApiException.class);
                                  if (acct != null) {
                                      email = acct.getEmail();
                                      name = acct.getDisplayName();
                                      idToken = acct.getIdToken();
                                  }
                              } catch (Exception ex) {
                                  email = result.getData().getStringExtra(android.accounts.AccountManager.KEY_ACCOUNT_NAME);
                              }
                              if (email == null) {
                                  email = result.getData().getStringExtra(android.accounts.AccountManager.KEY_ACCOUNT_NAME);
                              }
                          }
                          if (email != null && !email.isEmpty()) {
                              if (name == null || name.isEmpty()) {
                                  name = email.split("@")[0];
                              }
                              final String sEmail = email.replace("'", "\\'");
                              final String sName = name.replace("'", "\\'");
                              final String sToken = idToken != null ? idToken.replace("'", "\\'") : "";
                              runOnUiThread(() -> {
                                  if (webView != null) {
                                      webView.evaluateJavascript(
                                          "if(window.onZorenoNativeGoogleLogin){window.onZorenoNativeGoogleLogin('" + sEmail + "','" + sName + "','" + sToken + "');}",
                                          null
                                      );
                                  }
                              });
                          }
                      }
                  );
                  android.view.View rootContentView = findViewById(android.R.id.content);
                  if (rootContentView != null) {
                      rootContentView.setBackgroundColor(android.graphics.Color.BLACK);
                      androidx.core.view.ViewCompat.setOnApplyWindowInsetsListener(rootContentView, (v, insets) -> {
                          androidx.core.graphics.Insets bars = insets.getInsets(
                              androidx.core.view.WindowInsetsCompat.Type.systemBars() |
                              androidx.core.view.WindowInsetsCompat.Type.ime()
                          );
                          v.setBackgroundColor(android.graphics.Color.BLACK);
                          v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return androidx.core.view.WindowInsetsCompat.CONSUMED;
                      });
                      if (rootContentView instanceof android.view.ViewGroup) {
                          final android.view.ViewGroup rootGroup = (android.view.ViewGroup) rootContentView;
                          final android.widget.ImageView nativeSplash = new android.widget.ImageView(this);
                          nativeSplash.setImageResource(R.drawable.splash);
                          nativeSplash.setScaleType(android.widget.ImageView.ScaleType.CENTER_CROP);
                          nativeSplash.setBackgroundColor(android.graphics.Color.BLACK);
                          nativeSplash.setElevation(9999f);
                          rootGroup.addView(nativeSplash, new android.view.ViewGroup.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          nativeSplash.postDelayed(() -> {
                              nativeSplash.animate().alpha(0f).setDuration(350).withEndAction(() -> {
                                  if (nativeSplash.getParent() != null) {
                                      ((android.view.ViewGroup) nativeSplash.getParent()).removeView(nativeSplash);
                                  }
                              }).start();
                          }, 1400);
                      }
                  }
                  """
                  if "setOnApplyWindowInsetsListener(rootContentView" not in code:
                      code = re.sub(
                          r'(super\.onCreate\s*\([^)]*\)\s*;)',
                          r'\1\n' + inset_and_google_code,
                          code,
                          count=1
                      )

                  # ---- FIXED BRIDGE BLOCK (with isPlayStoreBuild added) ----
                  js_bridge_code = """
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void startGoogleLogin() {
                          runOnUiThread(() -> {
                              try {
                                  com.google.android.gms.auth.api.signin.GoogleSignInOptions gso =
                                      new com.google.android.gms.auth.api.signin.GoogleSignInOptions.Builder(
                                          com.google.android.gms.auth.api.signin.GoogleSignInOptions.DEFAULT_SIGN_IN
                                      ).requestEmail().requestProfile().build();
                                  com.google.android.gms.auth.api.signin.GoogleSignInClient client =
                                      com.google.android.gms.auth.api.signin.GoogleSignIn.getClient(MainActivity.this, gso);
                                  client.signOut().addOnCompleteListener(t -> {
                                      zorenoGoogleLauncher.launch(client.getSignInIntent());
                                  });
                              } catch (Exception e) {
                                  try {
                                      android.content.Intent pickIntent = com.google.android.gms.common.AccountPicker.newChooseAccountIntent(
                                          null, null, new String[]{"com.google"}, false, null, null, null, null
                                      );
                                      zorenoGoogleLauncher.launch(pickIntent);
                                  } catch (Exception ex) {}
                              }
                          });
                      }
                      @android.webkit.JavascriptInterface
                      public boolean isPlayStoreBuild() {
                          return true;
                      }
                  }, "ZorenoGoogleAuth");

                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void speak(String text, String lang) {
                          if (zorenoTts != null && zorenoTtsReady) {
                              java.util.Locale loc = (lang != null && lang.startsWith("hi"))
                                  ? new java.util.Locale("hi", "IN") : new java.util.Locale("en", "IN");
                              zorenoTts.setLanguage(loc);
                              zorenoTts.speak(text, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "zoreno_utt");
                          }
                      }
                      @android.webkit.JavascriptInterface
                      public void stop() {
                          if (zorenoTts != null) zorenoTts.stop();
                      }
                  }, "AndroidTTS");

                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public String getString(String key, String defVal) {
                          return getSharedPreferences("ZorenoQuotaPrefs", MODE_PRIVATE).getString(key, defVal);
                      }
                      @android.webkit.JavascriptInterface
                      public void setString(String key, String val) {
                          getSharedPreferences("ZorenoQuotaPrefs", MODE_PRIVATE).edit().putString(key, val).apply();
                      }
                      @android.webkit.JavascriptInterface
                      public boolean isFromPlayStore() {
                          return true;
                      }
                  }, "AndroidPrefs");

                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void shareText(String text) {
                          try {
                              android.content.Intent sendIntent = new android.content.Intent(android.content.Intent.ACTION_SEND);
                              sendIntent.setType("text/plain");
                              sendIntent.putExtra(android.content.Intent.EXTRA_TEXT, text);
                              startActivity(android.content.Intent.createChooser(sendIntent, "Share Zoreno AI Answer"));
                          } catch (Exception e) {}
                      }
                  }, "AndroidShare");

                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void downloadImage(String base64OrUrl, String fileName) {
                          try {
                              String pureBase64 = base64OrUrl.contains(",") ? base64OrUrl.split(",")[1] : base64OrUrl;
                              byte[] bytes = android.util.Base64.decode(pureBase64, android.util.Base64.DEFAULT);
                              java.io.File dir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              java.io.File outFile = new java.io.File(dir, fileName);
                              java.io.FileOutputStream fos = new java.io.FileOutputStream(outFile);
                              fos.write(bytes);
                              fos.flush();
                              fos.close();
                          } catch (Exception e) {}
                      }
                  }, "AndroidDownloader");

                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void showNotification(String title, String msg) {
                          try {
                              android.app.NotificationManager nm = (android.app.NotificationManager) getSystemService(android.content.Context.NOTIFICATION_SERVICE);
                              String chId = "zoreno_dm_channel_v3";
                              if (android.os.Build.VERSION.SDK_INT >= 26) {
                                  android.app.NotificationChannel ch = new android.app.NotificationChannel(chId, "Zoreno Messages", android.app.NotificationManager.IMPORTANCE_HIGH);
                                  ch.enableVibration(true);
                                  nm.createNotificationChannel(ch);
                              }
                              android.content.Intent intent = new android.content.Intent(MainActivity.this, MainActivity.class);
                              intent.setFlags(android.content.Intent.FLAG_ACTIVITY_SINGLE_TOP | android.content.Intent.FLAG_ACTIVITY_CLEAR_TOP);
                              android.app.PendingIntent pi = android.app.PendingIntent.getActivity(
                                  MainActivity.this, 0, intent,
                                  android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE
                              );
                              androidx.core.app.NotificationCompat.Builder b = new androidx.core.app.NotificationCompat.Builder(MainActivity.this, chId)
                                  .setSmallIcon(R.mipmap.ic_launcher)
                                  .setContentTitle(title)
                                  .setContentText(msg)
                                  .setPriority(androidx.core.app.NotificationCompat.PRIORITY_HIGH)
                                  .setDefaults(androidx.core.app.NotificationCompat.DEFAULT_ALL)
                                  .setContentIntent(pi)
                                  .setAutoCancel(true);
                              nm.notify((int) (System.currentTimeMillis() & 0xfffffff), b.build());
                          } catch (Exception e) {}
                      }
                  }, "AndroidNotif");
                  """
                  if "ZorenoGoogleAuth" not in code:
                      code = re.sub(
                          r'(setJavaScriptEnabled\s*\(\s*true\s*\)\s*;)',
                          r'\1\n' + js_bridge_code,
                          code,
                          count=1
                      )

              with open(java_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Successfully auto-patched", java_file)
          PYEOF

          # 6. Clean themes.xml (Pure Black Status Bar & Sahi Splash Icon)
          rm -f app/src/main/res/values/styles.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.Zoreno" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar" tools:targetApi="27">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:fitsSystemWindows">true</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:windowSplashScreenBackground" tools:targetApi="31">#000000</item>
                  <item name="android:windowSplashScreenAnimatedIcon" tools:targetApi="31">@mipmap/ic_launcher</item>
              </style>
          </resources>
          EOF

          cp app/src/main/res/values/themes.xml app/src/main/res/values-night/themes.xml
          cp app/src/main/res/values/themes.xml app/src/main/res/values-v31/themes.xml

          # 7. AndroidManifest.xml me App Name, Icon, Notification, Billing Permission, adjustResize aur Theme fix karein
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
            sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
            sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/g' app/src/main/AndroidManifest.xml
            sed -i 's/android:theme="[^"]*"/android:theme="@style\/Theme.Zoreno"/g' app/src/main/AndroidManifest.xml
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml
            sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' app/src/main/AndroidManifest.xml
            if ! grep -q "POST_NOTIFICATIONS" app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <application/g' app/src/main/AndroidManifest.xml
            fi
            if ! grep -q "com.android.vending.BILLING" app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<uses-permission android:name="com.android.vending.BILLING" \/>\n    <application/g' app/src/main/AndroidManifest.xml
            fi
            if ! grep -q "windowSoftInputMode" app/src/main/AndroidManifest.xml; then
              sed -i 's/<activity /<activity android:windowSoftInputMode="adjustResize" /g' app/src/main/AndroidManifest.xml
            else
              sed -i 's/android:windowSoftInputMode="[^"]*"/android:windowSoftInputMode="adjustResize"/g' app/src/main/AndroidManifest.xml
            fi
          fi

          # 8. Zoreno Automatic CSS Fixes (Safe rules so Profile/Groups/Chats never get stuck)
          cat << 'EOF' > app/src/main/assets/zoreno-fixes.css
          html, body {
              width: 100% !important;
              height: 100dvh !important;
              max-height: 100dvh !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow-x: hidden !important;
              box-sizing: border-box !important;
          }
          .bottom-nav, .floating-nav, nav.bottom-bar {
              bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
              z-index: 999 !important;
          }
          body.keyboard-open .bottom-nav,
          body.keyboard-open .floating-nav,
          body.keyboard-open nav.bottom-bar {
              display: none !important;
          }
          #zoreno-custom-splash {
              position: fixed;
              inset: 0;
              background: #000000 url('splash.png') no-repeat center center;
              background-size: cover;
              z-index: 999999;
              transition: opacity 0.35s ease;
              pointer-events: none;
          }
          .zoreno-google-btn-wrap {
              width: 100%;
              margin-top: 12px;
              margin-bottom: 8px;
              text-align: center;
          }
          .zoreno-or-divider {
              display: flex;
              align-items: center;
              text-align: center;
              color: #888;
              font-size: 12px;
              margin: 10px 0;
          }
          .zoreno-or-divider::before, .zoreno-or-divider::after {
              content: '';
              flex: 1;
              border-bottom: 1px solid #e0e0e0;
          }
          .zoreno-or-divider span {
              padding: 0 12px;
              font-weight: 600;
          }
          .zoreno-google-btn {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              width: 100%;
              padding: 12px 16px;
              background: #ffffff;
              color: #1f1f1f;
              border: 1px solid #dcdcdc;
              border-radius: 999px;
              font-size: 15px;
              font-weight: 600;
              cursor: pointer;
              box-shadow: 0 2px 8px rgba(0,0,0,0.05);
          }
          .zoreno-google-btn:active {
              transform: scale(0.98);
              background: #f5f5f5;
          }
          EOF

          # 9. Clean Zoreno JS Fixes (Splash + Keyboard + Native Google Sign-In)
          cat << 'EOF' > app/src/main/assets/zoreno-fixes.js
          (function() {
              let splash = document.getElementById('zoreno-custom-splash');
              if (!splash) {
                  splash = document.createElement('div');
                  splash.id = 'zoreno-custom-splash';
                  document.documentElement.appendChild(splash);
              }
              window.addEventListener('load', () => {
                  setTimeout(() => {
                      if (splash) {
                          splash.style.opacity = '0';
                          setTimeout(() => splash.remove(), 350);
                      }
                  }, 1000);
              });

              if (window.visualViewport) {
                  const initialHeight = window.visualViewport.height;
                  window.visualViewport.addEventListener('resize', () => {
                      if (window.visualViewport.height < initialHeight * 0.78) {
                          document.body.classList.add('keyboard-open');
                      } else {
                          document.body.classList.remove('keyboard-open');
                      }
                  });
              }

              window.onZorenoNativeGoogleLogin = async function(email, displayName, idToken) {
                  if (!email) return;
                  try {
                      if (window.firebase && firebase.auth) {
                          if (idToken) {
                              try {
                                  const cred = firebase.auth.GoogleAuthProvider.credential(idToken);
                                  await firebase.auth().signInWithCredential(cred);
                                  return;
                              } catch (err) {}
                          }
                          const googlePass = 'ZorenoGoogle#' + email.toLowerCase();
                          try {
                              await firebase.auth().signInWithEmailAndPassword(email, googlePass);
                          } catch (signInErr) {
                              if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential' || signInErr.code === 'auth/wrong-password') {
                                  try {
                                      const userCred = await firebase.auth().createUserWithEmailAndPassword(email, googlePass);
                                      if (userCred.user && displayName) {
                                          await userCred.user.updateProfile({ displayName: displayName });
                                      }
                                  } catch (createErr) {}
                              }
                          }
                      }
                  } catch (e) {}
              };

              window.addEventListener('DOMContentLoaded', () => {
                  const loginBtn = document.getElementById('loginSubmitBtn');
                  if (loginBtn && !document.getElementById('zoreno-google-login-btn')) {
                      const wrap = document.createElement('div');
                      wrap.className = 'zoreno-google-btn-wrap';
                      wrap.innerHTML = `
                          <div class="zoreno-or-divider"><span>OR</span></div>
                          <button type="button" id="zoreno-google-login-btn" class="zoreno-google-btn">
                              <svg width="20" height="20" viewBox="0 0 48 48">
                                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                              </svg>
                              <span>Continue with Google</span>
                          </button>
                      `;
                      loginBtn.parentNode.insertBefore(wrap, loginBtn.nextSibling);
                      document.getElementById('zoreno-google-login-btn').addEventListener('click', () => {
                          if (window.ZorenoGoogleAuth && typeof window.ZorenoGoogleAuth.startGoogleLogin === 'function') {
                              window.ZorenoGoogleAuth.startGoogleLogin();
                          }
                      });
                  }
              });
          })();
          EOF

          # 10. Inject zoreno-fixes.css, inline splash div, and zoreno-fixes.js into all HTML files
          for htmlfile in app/src/main/assets/*.html; do
            if [ -f "$htmlfile" ]; then
              sed -i 's/<\/head>/<link rel="stylesheet" href="zoreno-fixes.css"><\/head>/i' "$htmlfile"
              sed -i 's/<body[^>]*>/&<div id="zoreno-custom-splash"><\/div>/i' "$htmlfile"
              sed -i 's/<\/body>/<script src="zoreno-fixes.js"><\/script><\/body>/i' "$htmlfile"
            fi
          done

          # 11. GitHub repository se purani release keystore file ka upyog karein
          if [ -f "zoreno-release-key.jks" ]; then
            cp zoreno-release-key.jks app/zoreno-release-key.jks
            echo "Using existing zoreno-release-key.jks from repository"
          else
            rm -f app/zoreno-release-key.jks
            keytool -genkeypair -v \
              -keystore app/zoreno-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias zoreno \
              -storepass Zoreno@2026 \
              -keypass Zoreno@2026 \
              -dname "CN=Zoreno, OU=Mobile, O=Toko Platforms, L=Varanasi, S=UP, C=IN"
            echo "Generated new release keystore"
          fi

          cat << 'EOF' > keystore-details.txt
          Keystore File: zoreno-release-key.jks
          Key Alias: zoreno
          Store Password: Zoreno@2026
          Key Password: Zoreno@2026
          EOF

          # 12. Clean gradle.properties, settings.gradle.kts & build.gradle.kts (Version Code 7, Version Name 1.0.6)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=36
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Zoreno"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "$PKG_NAME"
              compileSdk = 36

              defaultConfig {
                  applicationId = "$APP_ID"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 7
                  versionName = "1.0.6"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("zoreno-release-key.jks")
                      storePassword = "Zoreno@2026"
                      keyAlias = "zoreno"
                      keyPassword = "Zoreno@2026"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity:1.9.3")
              implementation("androidx.core:core:1.13.1")
              implementation("androidx.constraintlayout:constraintlayout:2.2.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("com.google.android.gms:play-services-ads:23.6.0")
              implementation("com.google.android.gms:play-services-auth:21.2.0")
              implementation("com.google.firebase:firebase-messaging:24.1.0")
              implementation("com.android.billingclient:billing:8.0.0")
              implementation("com.google.code.gson:gson:2.11.0")
              implementation("androidx.browser:browser:1.8.0")
          }
          EOF

          echo "Running Clean Gradle Build..."
          gradle assembleDebug assembleRelease bundleRelease -x lint -x lintDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zoreno-mobile-release-package
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            app/zoreno-release-key.jks
            keystore-details.txt
