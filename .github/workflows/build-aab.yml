                                  cv.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, isImg ? (android.os.Environment.DIRECTORY_PICTURES + "/Zoreno") : (android.os.Environment.DIRECTORY_DOWNLOADS + "/Zoreno"));
                                  android.net.Uri col = isImg ? android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI : android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                                  android.net.Uri uri = getContentResolver().insert(col, cv);
                                  if (uri != null) {
