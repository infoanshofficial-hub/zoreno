name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Package
        run: |
          unzip -o *.zip || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Structure and Build
        run: |
          # 1. Project root dhoondein jahan settings.gradle file hai
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle file nahi mili!"
            exit 1
          fi

          PROJ_DIR=$(dirname "$SETTINGS_FILE")
          echo "Entering project directory: $PROJ_DIR"
          cd "$PROJ_DIR"

          # 2. Agar 'app' folder missing hai to auto-create karein
          if [ ! -d "app" ]; then
            echo "Creating missing 'app' module structure..."
            mkdir -p app/src/main/assets
            mkdir -p app/src/main/java
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable
            mkdir -p app/src/main/res/mipmap-anydpi-v26

            # App build.gradle
            if [ -f "build.gradle (1).kts" ]; then
              mv "build.gradle (1).kts" app/build.gradle.kts
            elif [ -f "build.gradle (1)" ]; then
              mv "build.gradle (1)" app/build.gradle
            fi

            # Manifest
            [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/

            # Web assets (HTML, CSS, JS, Sounds)
            mv *.html *.css *.js metadata.json app/src/main/assets/ 2>/dev/null || true
            [ -d "sounds" ] && mv sounds app/src/main/assets/ || true

            # Java / Kotlin source code
            mv *.java *.kt app/src/main/java/ 2>/dev/null || true

            # Resources (XMLs, images)
            mv colors.xml themes.xml strings.xml backup_rules.xml data_extraction_rules.xml app/src/main/res/values/ 2>/dev/null || true
            mv ic_launcher*.xml logo.png splash.png app/src/main/res/drawable/ 2>/dev/null || true
            mv ic_launcher*.webp app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
            [ -f "proguard-rules.pro" ] && cp proguard-rules.pro app/ || true
          fi

          echo "Running Gradle Build..."
          gradle assembleDebug bundleRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoreno-mobile-release-package
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
