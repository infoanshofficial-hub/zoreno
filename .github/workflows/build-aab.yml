                              byte[] bytes = android.util.Base64.decode(pure, android.util.Base64.DEFAULT);
                              String safeName = (fileName != null && !fileName.isEmpty()) ? fileName : ("Zoreno_" + System.currentTimeMillis());
                              String safeMime = (mimeType != null && !mimeType.isEmpty()) ? mimeType : (safeName.endsWith(".pdf") ? "application/pdf" : "image/jpeg");
                              boolean isImg = safeMime.startsWith("image/");
                              if (android.os.Build.VERSION.SDK_INT >= 29) {
                                  android.content.ContentValues cv = new android.content.ContentValues();
                                  cv.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, safeName);
