name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Setup Clean Project Structure and Build
        run: |
          # 0. Purane build folders saaf karein aur agar zip hai toh extract karein
          rm -rf app build .gradle gradle libs.versions.toml
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" || true
          done

          # 1. MainActivity.java se exact package name nikalein
          PKG_NAME=""
          if [ -f "MainActivity.java" ]; then
            PKG_NAME=$(grep -oP '^package\s+\K[^;]+' MainActivity.java | tr -d '[:space:]' || true)
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.zoreno.app"
          fi
          PKG_DIR=$(echo "$PKG_NAME" | tr '.' '/')
          echo "Detected Code Namespace: $PKG_NAME"

          # Play Store com.example allow nahi karta, isliye final App ID com.zoreno.app rakhein
          if [[ "$PKG_NAME" == com.example* ]]; then
            APP_ID="com.zoreno.app"
          else
            APP_ID="$PKG_NAME"
          fi
          echo "Play Store Application ID: $APP_ID"

          # 2. Sahi Android folders banayein
          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-xxhdpi

          # 3. Code, Manifest aur Web Assets move karein
          cp *.java "app/src/main/java/$PKG_DIR/" 2>/dev/null || true
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
            sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
          fi
          cp *.html *.css *.js metadata.json app/src/main/assets/ 2>/dev/null || true
          [ -d "sounds" ] && cp -r sounds app/src/main/assets/ || true

          # 4. XML aur Image Resources sahi folders me move karein
          cp colors.xml themes.xml strings.xml styles.xml dimens.xml app/src/main/res/values/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp backup_rules.xml data_extraction_rules.xml network_security_config.xml file_paths.xml app/src/main/res/xml/ 2>/dev/null || true

          rm -f *"("*").webp" *.kt
          cp ic_launcher_background.xml ic_launcher_foreground.xml logo.png splash.png app/src/main/res/drawable/ 2>/dev/null || true
          cp ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
          cp ic_launcher.webp ic_launcher_round.webp app/src/main/res/mipmap-xxhdpi/ 2>/dev/null || true
          [ -f "proguard-rules.pro" ] && cp proguard-rules.pro app/ || true

          # 5. Play Store ke liye Release Keystore generate karein
          rm -f app/zoreno-release-key.jks
          keytool -genkeypair -v \
            -keystore app/zoreno-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zoreno \
            -storepass Zoreno@2026 \
            -keypass Zoreno@2026 \
            -dname "CN=Zoreno, OU=Mobile, O=Zoreno, L=Varanasi, S=UP, C=IN"

          cat << 'EOF' > keystore-details.txt
          Keystore File: zoreno-release-key.jks
          Key Alias: zoreno
          Store Password: Zoreno@2026
          Key Password: Zoreno@2026
          (Play Store par agle updates dalne ke liye is file aur password ko sambhal kar rakhein)
          EOF

          # 6. Clean gradle.properties banayein
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 7. Clean settings.gradle.kts banayein
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Zoreno"
          include(":app")
          EOF

          # 8. Clean Root build.gradle.kts banayein (Stable AGP 8.7.3)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          # 9. Clean App app/build.gradle.kts banayein (With Google AdMob SDK & Release Signing)
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "$PKG_NAME"
              compileSdk = 35

              defaultConfig {
                  applicationId = "$APP_ID"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("zoreno-release-key.jks")
                      storePassword = "Zoreno@2026"
                      keyAlias = "zoreno"
                      keyPassword = "Zoreno@2026"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity:1.9.3")
              implementation("androidx.core:core:1.13.1")
              implementation("androidx.constraintlayout:constraintlayout:2.2.0")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("com.google.android.gms:play-services-ads:23.6.0")
              implementation("com.android.billingclient:billing:7.1.1")
              implementation("com.google.code.gson:gson:2.11.0")
              implementation("androidx.browser:browser:1.8.0")
          }
          EOF

          echo "=== Checking Java Imports ==="
          grep "^import " "app/src/main/java/$PKG_DIR/"*.java || true

          echo "Running Clean Gradle Build..."
          gradle assembleDebug assembleRelease bundleRelease -x lint -x lintDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zoreno-mobile-release-package
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            app/zoreno-release-key.jks
            keystore-details.txt
            
