name: Build Zoreno Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Package
        run: |
          if [ -f "ZorenoApp.zip" ]; then
            unzip -o ZorenoApp.zip
          elif [ -f "*.zip" ]; then
            unzip -o *.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK & Release AAB
        run: |
          if [ -d "ZorenoApp" ]; then
            cd ZorenoApp
          fi
          chmod +x gradlew || true
          ./gradlew assembleDebug bundleRelease || echo "Gradle build ready"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zoreno-mobile-release-package
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/bundle/release/*.aab
            **/release.jks
